:root {

  --r: 10px; --r-sm: 6px;
  color-scheme: light;
}
:root[data-fp-theme="day"] { --bg: #e8f1fa; --surface-2: #f1f6fc; --surface-3: #e2ebf6; --line: #d3deec; --nav-bg: #114a9a; --nav-ink-2: #a9c2ea; --top-bg: #f7fbff; --top-line: #d3deec; --chart-grid: #e2e9f2; }

}

  --bg: #121212; --bg-ink: #ededed; --bg-ink-2: #b0b0b0; --surface: #1c1c1c; --surface-2: #242424; --surface-3: #2f2f2f; --ink: #ededed; --ink-2: #bdbdbd; --ink-3: #8f8f8f; --line: #333333; --line-2: #4a4a4a;
  --brand: #9cc0ff; --brand-2: #78a9f7; --brand-ink: #0a1a33; --brand-soft: #1f2a3d; --accent: #45c95a; --accent-2: #62d975; --accent-ink: #06190a; --accent-soft: #17301c; --lime: #a6e04a; --lime-soft: #252e15;
  --nav-bg: #0b0b0b; --nav-ink: #d6d6d6; --nav-ink-2: #8a8a8a; --nav-active: #2fb84a; --nav-active-ink: #04140a; --top-bg: #171717; --top-ink: #ededed; --top-line: #333333;
  --good: #57d970; --good-soft: #17301c; --warn: #f0b84a; --warn-soft: #33270d; --crit: #ff8278; --crit-soft: #3a1614; --info: #9cc0ff; --info-soft: #1f2a3d;

}
:root[data-fp-theme="lemon"] { --bg: #ecf7c8; --bg-ink: #1b2a10; --bg-ink-2: #4a5a31; --surface: #fcfff2; --surface-2: #f2f9d9; --surface-3: #e4f0bd; --ink: #1b2a10; --ink-2: #47572f; --ink-3: #6f7e55; --line: #d3e2a9; --line-2: #b5ca80; --brand: #2f6a14; --brand-2: #3d8719; --brand-soft: #e3f1c4; --accent: #3f8210; --accent-2: #2f6a14; --accent-soft: #e0f0bf; --nav-bg: #2f6a14; --nav-ink: #eaf6d6; --nav-ink-2: #b4d38c; --nav-active: #a9d83c; --nav-active-ink: #16300a; --top-bg: #fcfff2; --top-line: #d3e2a9; --chart-grid: #e3ecc6; --chart-axis: #b5ca80; --info: #2f6a14; --info-soft: #e3f1c4; --focus: #2f6a14; }

  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45); --chart-grid: #1c3a70; --chart-axis: #31569c; --focus: #a7c6ff; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--brand-2); }
svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.num, td.n, th.n { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .93em; } .tbl td.mono { white-space: nowrap; }
.muted { color: var(--ink-3); } .soft { color: var(--ink-2); }
.neg { color: var(--crit); } .pos { color: var(--good); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
#fp-root { height: 100%; }
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
.shell.nav-collapsed { grid-template-columns: 0 minmax(0, 1fr); }
.shell.nav-collapsed .nav { transform: translateX(-100%); }
.strip { display: flex; height: 4px; } .strip i { flex: 1; } .strip i:nth-child(1) { background: #0b3470; } .strip i:nth-child(2) { background: #128a1a; } .strip i:nth-child(3) { background: #86c81f; }
.nav { background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column; min-height: 0; transition: transform .2s ease; z-index: 30; }
.nav-head { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px; border-bottom: 1px solid var(--nav-line); }
.nav-brand { min-width: 0; } .nav-brand b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: .01em; color: #fff; line-height: 1.15; } .nav-brand span { font-size: 11px; color: var(--nav-ink-2); letter-spacing: .06em; text-transform: uppercase; }
.nav-scroll { overflow-y: auto; padding: 8px 8px 16px; flex: 1; scrollbar-width: thin; }
.nav-group { margin-top: 12px; padding: 0 8px 4px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--nav-ink-2); }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; background: none; color: var(--nav-ink); border-radius: 7px; cursor: pointer; text-align: left; font-size: 13.5px; }
.nav-item:hover { background: var(--nav-hover); }
.nav-item.on { background: var(--nav-active); color: var(--nav-active-ink); font-weight: 600; }
.nav-item svg { flex: none; opacity: .9; }
.nav-item .badge { margin-left: auto; background: var(--lime); color: #16300a; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
.nav-foot { padding: 10px 14px 12px; border-top: 1px solid var(--nav-line); font-size: 11.5px; color: var(--nav-ink-2); line-height: 1.4; }
.nav-foot b { color: var(--nav-ink); font-weight: 600; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { background: var(--top-bg); color: var(--top-ink); border-bottom: 1px solid var(--top-line); display: flex; align-items: center; gap: 8px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; position: relative; z-index: 20; }
.top .co { min-width: 0; margin-right: auto; display: flex; align-items: center; gap: 10px; }
.top .co b { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
.top .co small { display: block; font-size: 11.5px; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
.top .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.top select, .top .tbtn { height: 32px; border: 1px solid var(--top-line); background: transparent; color: var(--top-ink); border-radius: 7px; padding: 0 9px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.top .tools select.inp { width: auto; max-width: 178px; height: 32px; background: transparent; color: var(--top-ink); border-color: var(--top-line); padding: 0 9px; font-size: 12.5px; }
.top select option { color: #0c1b33; background: #fff; }
.top .tbtn:hover, .top select:hover { background: color-mix(in srgb, var(--top-ink) 9%, transparent); }
.top .tbtn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.top .tbtn.warn { border-color: var(--lime); box-shadow: inset 0 0 0 1px var(--lime); }
.content { flex: 1; overflow: auto; min-height: 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); scroll-behavior: smooth; }
.page { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; color: var(--bg-ink); }
.page-head h1 { font-family: var(--f-display); font-weight: 600; font-size: 27px; letter-spacing: -.005em; line-height: 1.15; }
.page-head p { color: var(--bg-ink-2); max-width: 74ch; margin-top: 4px; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--bg-ink-2); font-weight: 600; }

/* ---------- surfaces ---------- */
.card { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card.pad { padding: 16px; }
.card > .card-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card > .card-h h3 { font-size: 14.5px; font-weight: 600; }
.card > .card-h .sub { color: var(--ink-3); font-size: 12.5px; }
.card > .card-h .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.card > .card-b { padding: 14px 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-auto { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sp-l { margin-left: auto; }
.hr { height: 1px; background: var(--line); border: 0; margin: 4px 0; }
.scroll-x { overflow-x: auto; max-width: 100%; }
.note { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; font-size: 13px; color: var(--ink-2); }
.note.good { background: var(--good-soft); border-color: transparent; color: var(--ink); } .note.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); } .note.crit { background: var(--crit-soft); border-color: transparent; color: var(--ink); } .note.info { background: var(--info-soft); border-color: transparent; color: var(--ink); }
.note b { color: var(--ink); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); } .btn.pri:hover { background: color-mix(in srgb, var(--brand) 86%, #000); }
.btn.acc { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); } .btn.acc:hover { background: var(--accent-2); }
.btn.dan { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 45%, var(--line)); } .btn.dan:hover { background: var(--crit-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: 6px; }
.btn.ico { width: 30px; padding: 0; height: 30px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.on-bg .btn.ghost { color: var(--bg-ink); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12px; font-weight: 600; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.field .hint { font-size: 11.5px; color: var(--ink-3); }
.inp, select.inp, textarea.inp { height: 34px; width: 100%; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 7px; padding: 0 10px; min-width: 0; }
textarea.inp { height: auto; min-height: 70px; padding: 8px 10px; resize: vertical; }
.inp:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.inp.n { text-align: right; font-variant-numeric: tabular-nums; }
.inp.sm { height: 28px; font-size: 12.5px; padding: 0 7px; }
.inp[readonly], .inp:disabled { background: var(--surface-2); color: var(--ink-2); }
.form { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px 14px; }
.form > .field { grid-column: span 6; } .form > .s12 { grid-column: span 12; } .form > .s4 { grid-column: span 4; } .form > .s3 { grid-column: span 3; } .form > .s8 { grid-column: span 8; } .form > .s6 { grid-column: span 6; } .form > .s2 { grid-column: span 2; }
.filters { display: flex; gap: 10px 12px; flex-wrap: wrap; align-items: flex-end; }
.filters .field { min-width: 130px; } .filters .field.w { min-width: 220px; }
.chk { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; user-select: none; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch i { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .15s; flex: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + i { background: var(--accent); } .switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 11px; height: 32px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; } .seg button.on { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 600; line-height: 19px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.crit { background: var(--crit-soft); color: var(--crit); } .chip.info { background: var(--info-soft); color: var(--info); } .chip.lime { background: var(--lime-soft); color: var(--accent-2); }
.infob { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--brand-2); font-size: 11px; font-weight: 700; font-family: var(--f-display); font-style: italic; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; line-height: 1; }
.infob:hover { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; background: var(--surface); border-radius: var(--r) var(--r) 0 0; padding: 0 8px; }
.tabs button { border: 0; background: none; padding: 11px 12px 9px; cursor: pointer; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--ink); } .tabs button.on { color: var(--brand); border-bottom-color: var(--accent); font-weight: 600; }
.tabbed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tabbed > .tab-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ---------- tables ---------- */
.tbl-wrap { overflow: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.tbl-wrap.tall { max-height: 62vh; }
table.tbl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }

/* ---------- clocks ---------- */

.clock svg { width: 86px; height: 86px; }
.clock .city { font-weight: 600; font-size: 13px; } .clock .dig { font-family: var(--f-mono); font-size: 15px; font-weight: 500; letter-spacing: .02em; font-variant-numeric: tabular-nums; } .clock .date { font-size: 11.5px; color: var(--ink-3); } .clock .off { font-size: 10.5px; color: var(--ink-3); letter-spacing: .05em; }

/* ---------- guide ---------- */

.cycle button { counter-increment: st; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 10px 10px; text-align: left; cursor: pointer; color: var(--ink); display: flex; flex-direction: column; gap: 4px; min-width: 0; position: relative; }

.step.done { background: var(--good-soft); border-color: transparent; } .step .t b { display: block; font-size: 13.5px; } .step .t span { font-size: 12.5px; color: var(--ink-2); }
details.acc { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); } details.acc + details.acc { margin-top: 8px; }
details.acc summary { cursor: pointer; padding: 10px 12px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; } details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::before { content: "+"; font-family: var(--f-mono); color: var(--accent); width: 12px; } details.acc[open] summary::before { content: "-"; }
details.acc .ab { padding: 0 12px 12px 32px; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; } details.acc .ab p + p { margin-top: 6px; }
.code-anat { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.code-anat div { border: 1px solid var(--line-2); border-radius: 9px; padding: 8px 12px; min-width: 110px; background: var(--surface); } .code-anat div b { font-family: var(--f-mono); font-size: 22px; display: block; color: var(--brand); } .code-anat div span { font-size: 12px; color: var(--ink-2); } .code-anat .dash { border: 0; min-width: 0; padding: 0; align-self: center; font-family: var(--f-mono); font-size: 22px; color: var(--ink-3); background: none; }

.eqn { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; } .eqn div { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px; background: var(--surface); } .eqn div small { display: block; color: var(--ink-3); font-size: 11.5px; } .eqn div b { font-variant-numeric: tabular-nums; }
.timeline { display: flex; flex-direction: column; gap: 0; } .timeline .ev { display: grid; grid-template-columns: 96px 16px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 0; font-size: 13px; } .timeline .ev .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 5px; justify-self: center; } .timeline .ev .when { color: var(--ink-3); font-size: 12.5px; }

.period { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 9px 10px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; } .period.closed { background: var(--surface-2); } .period.adj { border-style: dashed; border-color: var(--accent); } .period b { font-size: 13px; } .period small { color: var(--ink-3); font-size: 11.5px; }
.drop { border: 2px dashed var(--line-2); border-radius: var(--r); padding: 26px 16px; text-align: center; color: var(--ink-2); background: var(--surface-2); } .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.jl-grid { display: grid; gap: 6px; } .jl-row { display: grid; grid-template-columns: minmax(180px, 2.2fr) minmax(120px, 1.6fr) minmax(110px, 1fr) 118px 118px 30px; gap: 6px; align-items: center; } .jl-row.head { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.two-pane { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }

/* ---------- print ---------- */
#fp-print { display: none; }
@media print {
  html, body { height: auto; background: #fff; } #fp-root, #fp-toasts, .ovl, .pop, .menu, #fp-tip, .drawer { display: none !important; }
  #fp-print { display: block; color: #000; font-family: var(--f-ui); font-size: 10pt; }
  #fp-print h2 { font-family: var(--f-display); font-size: 15pt; margin: 0 0 2pt; } #fp-print .co { font-size: 9pt; letter-spacing: .08em; text-transform: uppercase; } #fp-print .meta { font-size: 8pt; color: #444; margin-bottom: 8pt; }
  #fp-print table { border-collapse: collapse; width: 100%; font-size: 8.5pt; margin-bottom: 14pt; } #fp-print th { text-align: left; border-bottom: 1pt solid #000; padding: 3pt 4pt; } #fp-print td { padding: 2pt 4pt; border-bottom: .3pt solid #bbb; } #fp-print td.n, #fp-print th.n { text-align: right; }
  #fp-print tr.r-head td { font-weight: 700; } #fp-print tr.r-sub td { font-weight: 700; border-top: .6pt solid #000; } #fp-print tr.r-total td { font-weight: 700; border-top: .6pt solid #000; border-bottom: 2pt double #000; }
  #fp-print section { page-break-after: always; } #fp-print section:last-child { page-break-after: auto; } #fp-print .foot { font-size: 7.5pt; color: #555; margin-top: 6pt; }
}

/* ---------- responsive ---------- */

.g2.wide-l { grid-template-columns: minmax(0, 1.28fr) minmax(0, .72fr); align-items: start; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); } .nav { position: fixed; top: 0; bottom: 0; left: 0; width: min(280px, 86vw); transform: translateX(-100%); padding-top: env(safe-area-inset-top, 0px); } .shell.nav-open .nav { transform: none; box-shadow: var(--shadow); } .shell.nav-collapsed .nav { transform: translateX(-100%); }

'use strict';
/* =====================================================================
   FinPolNomics SME Accounting Suite
   Core: numbers, dates, formatting, state container, audit, archive, roles
   ===================================================================== */
const FP = { version: '1.0.0', build: '2026-11' };

/* ---------- errors ---------- */
FP.E = function (msg) { const e = new Error(msg); e.user = true; return e; };

/* ---------- numbers ---------- */
FP.r2 = function (n) { if (!isFinite(n)) return 0; const x = Math.round(Math.abs(n) * 100 + 1e-6) / 100; return n < 0 ? -x : x; };
FP.r4 = function (n) { if (!isFinite(n)) return 0; const x = Math.round(Math.abs(n) * 10000 + 1e-6) / 10000; return n < 0 ? -x : x; };
FP.r6 = function (n) { if (!isFinite(n)) return 0; const x = Math.round(Math.abs(n) * 1e6 + 1e-6) / 1e6; return n < 0 ? -x : x; };
FP.near = function (a, b, tol) { return Math.abs((a || 0) - (b || 0)) < (tol || 0.005); };
FP.num = function (v) { if (typeof v === 'number') return isFinite(v) ? v : 0; if (v == null) return 0; const n = parseFloat(String(v).replace(/[, ]/g, '')); return isFinite(n) ? n : 0; };
FP.sum = function (arr, fn) { let t = 0; for (let i = 0; i < arr.length; i++) t += fn ? fn(arr[i], i) : arr[i]; return t; };
FP.clone = function (o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); };
FP.pad = function (n, w) { return String(n).padStart(w, '0'); };

/* ---------- dates (ISO strings, UTC arithmetic) ---------- */
FP.D = {
  p(s) { const a = String(s).split('-'); return new Date(Date.UTC(+a[0], +a[1] - 1, +(a[2] || 1))); },
  f(d) { return d.toISOString().slice(0, 10); },
  valid(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s))) return false; const d = FP.D.p(s); return !isNaN(d) && FP.D.f(d) === s; },
  addDays(s, n) { const d = FP.D.p(s); d.setUTCDate(d.getUTCDate() + n); return FP.D.f(d); },
  daysIn(ym) { const a = ym.split('-'); return new Date(Date.UTC(+a[0], +a[1], 0)).getUTCDate(); },
  ym(s) { return String(s).slice(0, 7); },
  som(s) { return String(s).slice(0, 7) + '-01'; },
  eom(s) { const ym = String(s).slice(0, 7); return ym + '-' + FP.pad(FP.D.daysIn(ym), 2); },
  isEom(s) { return FP.D.eom(s) === s; },
  ymAdd(ym, n) { const a = ym.split('-'); const t = (+a[0]) * 12 + (+a[1] - 1) + n; return Math.floor(t / 12) + '-' + FP.pad((t % 12 + 12) % 12 + 1, 2); },
  ymDiff(a, b) { const x = a.split('-'), y = b.split('-'); return (+y[0] - +x[0]) * 12 + (+y[1] - +x[1]); },
  addMonths(s, n) { const ym = FP.D.ymAdd(FP.D.ym(s), n); const day = Math.min(+s.slice(8, 10), FP.D.daysIn(ym)); return ym + '-' + FP.pad(day, 2); },
  diffDays(a, b) { return Math.round((FP.D.p(b) - FP.D.p(a)) / 86400000); },
  today() { const d = new Date(); return d.getFullYear() + '-' + FP.pad(d.getMonth() + 1, 2) + '-' + FP.pad(d.getDate(), 2); },
  year(s) { return +String(s).slice(0, 4); },
  MON: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  MONTHS: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
};

/* ---------- formatting ---------- */
FP.fmt = {
  num(n, dp) { dp = dp == null ? 2 : dp; n = +n || 0; const neg = n < 0; const s = Math.abs(n).toFixed(dp); const parts = s.split('.'); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return (neg ? '-' : '') + parts.join('.'); },
  /* accounting style: negatives in brackets, zero as a dash */
  acc(n, dp) { n = +n || 0; if (Math.abs(n) < 0.005) return '-'; const s = FP.fmt.num(Math.abs(n), dp == null ? 2 : dp); return n < 0 ? '(' + s + ')' : s; },
  sym(cur) { const c = (FP.S && FP.S.currencies || []).find(x => x.code === cur); return c ? c.symbol : (cur || ''); },
  money(n, cur, dp) { n = +n || 0; const s = FP.fmt.sym(cur || (FP.S && FP.S.settings.functional)) + FP.fmt.num(Math.abs(n), dp == null ? 2 : dp); return n < 0 ? '(' + s + ')' : s; },

/* =====================================================================

FP.GROUPS = {

  CA: { label: 'Current assets', el: ['10'], st: 'SOFP' },
  EQ: { label: 'Equity', el: ['30'], st: 'SOFP' },

FP.CFCLS = { cash: 'Cash and cash equivalents', op: 'Operating (working capital)', tax: 'Operating (income taxes)', inv: 'Investing', fin: 'Financing' };
FP.CF_DEFAULT = { NCA: 'inv', CA: 'op', EQ: 'fin', NCL: 'fin', CL: 'op' };

FP.Coa = {
  RE: /^(10|20|30|40|50)-\d{3}-\d{3}$/,
  map() { return FP.memo('coa.map', () => FP.by(FP.S.coa, 'code')); },
  get(code) { return this.map().get(code); },
  name(code) { const a = this.get(code); return a ? a.name : String(code); },
  label(code) { return code + ' ' + this.name(code); },
  el(code) { return String(code).slice(0, 2); },
  fsCode(code) { return String(code).slice(0, 6) + '-000'; },
  fs(code) { return this.get(this.fsCode(code)); },
  isBS(code) { const e = FP.ELEMENTS[String(code).slice(0, 2)]; return !!(e && e.bs); },
  normal(code) { const a = this.get(code); return (a && a.normal) || FP.ELEMENTS[String(code).slice(0, 2)].normal; },
  controls() { return FP.memo('coa.ctl', () => FP.S.coa.filter(a => a.ctl).sort((a, b) => a.code < b.code ? -1 : 1)); },
  postings() { return FP.memo('coa.post', () => FP.S.coa.filter(a => !a.ctl).sort((a, b) => a.code < b.code ? -1 : 1)); },
  children(fsCode) {
    const m = FP.memo('coa.kids', () => { const m = new Map(); for (const a of FP.Coa.postings()) { const k = FP.Coa.fsCode(a.code); if (!m.has(k)) m.set(k, []); m.get(k).push(a); } return m; });
    return m.get(fsCode) || [];
  },
  group(code) { const f = this.fs(code); return f ? f.group : FP.GROUP_DEFAULT[this.el(code)]; },
  /* equity account that an income or expense account closes into at year end */
  closeTo(code) { const f = this.fs(code); const t = f && f.closeTo; if (t && this.get(t)) return t; return FP.S.settings.accounts.re; },
  nextFs(el) { let mx = 0; for (const a of FP.S.coa) if (a.ctl && a.code.slice(0, 2) === el) mx = Math.max(mx, +a.code.slice(3, 6)); if (mx >= 999) throw FP.E('This element has used all 999 FS line codes.'); return el + '-' + FP.pad(mx + 1, 3) + '-000'; },
  nextNote(fsCode) { let mx = 0; const pre = fsCode.slice(0, 6); for (const a of FP.S.coa) if (!a.ctl && a.code.slice(0, 6) === pre) mx = Math.max(mx, +a.code.slice(7)); if (mx >= 999) throw FP.E('This FS line has used all 999 note line codes.'); return pre + '-' + FP.pad(mx + 1, 3); },
  usage(code) {
    const S = FP.S; let n = 0;
    for (const j of S.journals) for (const l of j.lines) if (l.acc === code) n++;
    return n;
  },
  refs(code) {
    const S = FP.S; const out = [];
    for (const k of Object.keys(S.settings.accounts)) if (S.settings.accounts[k] === code) out.push('Posting default: ' + k);
    for (const a of S.coa) if (a.ctl && a.closeTo === code) out.push('Close-to target of ' + a.code);
    for (const c of S.assetClasses) if (c.costAcc === code || c.accAcc === code || c.expAcc === code) out.push('Asset class: ' + c.name);
    for (const i of S.items) if (i.invAcc === code || i.cogsAcc === code || i.revAcc === code) out.push('Inventory item: ' + i.name);
    for (const p of S.prepaids) if (p.assetAcc === code || p.expAcc === code) out.push('Prepayment: ' + p.name);
    for (const p of S.accruals) if (p.liabAcc === code || p.expAcc === code) out.push('Accrual: ' + p.name);
    if (S.bankStmt.some(b => b.acc === code)) out.push('Bank statement lines');

  },
  addFs(d) {
    FP.need('master');

    const name = String(d.name || '').trim(); if (!name) throw FP.E('Give the FS line a name.');
    const code = d.code || this.nextFs(el);
    if (!this.RE.test(code) || code.slice(7) !== '000' || code.slice(0, 2) !== el) throw FP.E('FS line codes follow EE-FFF-000, for example 10-001-000.');
    if (this.get(code)) throw FP.E('Code ' + code + ' is already in use.');
    const group = d.group || FP.GROUP_DEFAULT[el];
    if (!FP.GROUPS[group] || FP.GROUPS[group].el.indexOf(el) < 0) throw FP.E('That statement section does not accept ' + FP.ELEMENTS[el].name + ' accounts.');
    const a = { code: code, name: name, ctl: true, group: group };
    if (FP.ELEMENTS[el].bs) a.cf = d.cf || FP.CF_DEFAULT[group]; else { a.closeTo = d.closeTo || ''; a.cft = d.cft || ''; }

  },
  addNote(d) {
    FP.need('master');
    const fs = this.get(d.fs); if (!fs || !fs.ctl) throw FP.E('Choose the FS line this note line rolls up into.');
    const name = String(d.name || '').trim(); if (!name) throw FP.E('Give the account a name.');
    const code = d.code || this.nextNote(d.fs);

    if (d.bank) a.bank = true;
    if (d.partyType) a.partyType = d.partyType;
    if (d.cur && d.cur !== FP.S.settings.functional) a.cur = d.cur;
    if (d.desc) a.desc = d.desc;
    FP.S.coa.push(a); FP.audit('Created account', 'Chart of accounts', code, name); FP.touch(); return a;
  },
  update(code, patch) {
    FP.need('master');
    const a = this.get(code); if (!a) throw FP.E('Account not found.');
    if ('name' in patch) { const n = String(patch.name || '').trim(); if (!n) throw FP.E('Name cannot be empty.'); a.name = n; }
    if (a.ctl) {
      const el = code.slice(0, 2);
      if (patch.group) { if (!FP.GROUPS[patch.group] || FP.GROUPS[patch.group].el.indexOf(el) < 0) throw FP.E('That statement section does not accept this element.'); a.group = patch.group; }
      if (FP.ELEMENTS[el].bs) { if (patch.cf) a.cf = patch.cf; } else { if ('closeTo' in patch) a.closeTo = patch.closeTo || ''; if ('cft' in patch) a.cft = patch.cft || ''; }

      if (patch.normal) a.normal = patch.normal;

      if ('partyType' in patch) { if (patch.partyType) a.partyType = patch.partyType; else delete a.partyType; }

  },

  },
  /* re-map a note line to another FS line: it receives the next free code under the new parent */
  remap(code, newFs) {

    if (f.code.slice(0, 2) !== code.slice(0, 2)) throw FP.E('An account can only be re-mapped within its own element (' + FP.ELEMENTS[code.slice(0, 2)].name + ').');
    if (this.fsCode(code) === newFs) throw FP.E('The account already sits under that FS line.');

    for (const j of S.journals) for (const l of j.lines) if (l.acc === code) l.acc = neu;
    for (const k of Object.keys(S.settings.accounts)) if (S.settings.accounts[k] === code) S.settings.accounts[k] = neu;
    for (const c of S.coa) if (c.ctl && c.closeTo === code) c.closeTo = neu;
    for (const c of S.assetClasses) for (const k of ['costAcc', 'accAcc', 'expAcc']) if (c[k] === code) c[k] = neu;
    for (const i of S.items) for (const k of ['invAcc', 'cogsAcc', 'revAcc']) if (i[k] === code) i[k] = neu;
    for (const p of S.prepaids) for (const k of ['assetAcc', 'expAcc']) if (p[k] === code) p[k] = neu;
    for (const p of S.accruals) for (const k of ['liabAcc', 'expAcc']) if (p[k] === code) p[k] = neu;

    for (const m of S.bankMatches) if (m.acc === code) m.acc = neu;

/* ---------------------------------------------------------------------
   Fiscal years and periods (with a closing adjustment period, the "13th month")
   --------------------------------------------------------------------- */
FP.FREQ = { M: { label: 'Monthly', step: 1 }, Q: { label: 'Quarterly', step: 3 }, H: { label: 'Semi-annual', step: 6 }, Y: { label: 'Annual', step: 12 } };
FP.FY = {
  list() { return FP.memo('fy.list', () => FP.S.fiscalYears.slice().sort((a, b) => a.start < b.start ? -1 : 1)); },
  get(id) { return FP.S.fiscalYears.find(f => f.id === id); },
  byDate(date) { return this.list().find(f => f.start <= date && date <= f.end); },
  prev(id) { const l = this.list(); const i = l.findIndex(f => f.id === id); return i > 0 ? l[i - 1] : null; },
  next(id) { const l = this.list(); const i = l.findIndex(f => f.id === id); return i >= 0 && i < l.length - 1 ? l[i + 1] : null; },
  adj(fy) { return fy.periods[fy.periods.length - 1]; },
  period(fy, no) { return fy.periods[no - 1]; },
  periodOf(date) { const fy = this.byDate(date); if (!fy) return null; const p = fy.periods.find(x => !x.adj && x.start <= date && date <= x.end); return p ? { fy: fy, p: p } : null; },
  latestOpen() { const l = this.list(); for (const f of l) if (f.status === 'open') return f; return l[l.length - 1]; },
  hasJournals(id) { return FP.S.journals.some(j => j.fy === id); },
  build(start, end, freq) {
    const step = FP.FREQ[freq].step; const out = []; let s = start; let n = 0;
    while (s <= end && n < 400) {
      n++;
      let e = FP.D.addDays(FP.D.addMonths(s, step), -1); if (e > end) e = end;
      let name;
      if (freq === 'M') name = 'P' + FP.pad(n, 2) + ' ' + FP.fmt.ym(FP.D.ym(e));
      else if (freq === 'Q') name = 'Q' + n + ' (to ' + FP.fmt.ym(FP.D.ym(e)) + ')';
      else if (freq === 'H') name = 'H' + n + ' (to ' + FP.fmt.ym(FP.D.ym(e)) + ')';
      else name = 'Full year to ' + FP.fmt.ym(FP.D.ym(e));
      out.push({ no: n, name: name, start: s, end: e, status: 'open', adj: false });
      s = FP.D.addDays(e, 1);
    }
    out.push({ no: n + 1, name: 'P' + FP.pad(n + 1, 2) + ' Year-end adjustments', start: end, end: end, status: 'open', adj: true });
    return out;
  },
  create(d) {
    FP.need('master');
    const S = FP.S; const start = d.start, end = d.end, freq = d.freq || 'M';
    if (!FP.D.valid(start) || !FP.D.valid(end) || end <= start) throw FP.E('Enter a valid start date and a later end date.');
    if (!FP.FREQ[freq]) throw FP.E('Choose a period frequency.');
    if (FP.D.diffDays(start, end) > 550) throw FP.E('A fiscal year cannot exceed 18 months.');
    const l = this.list();
    if (l.length) {
      const last = l[l.length - 1];
      if (start !== FP.D.addDays(last.end, 1)) throw FP.E('Fiscal years must follow each other without a gap. The next year must start on ' + FP.fmt.date(FP.D.addDays(last.end, 1)) + '.');
    }
    let id = 'FY' + end.slice(0, 4); let k = 1; while (this.get(id)) { k++; id = 'FY' + end.slice(0, 4) + String.fromCharCode(64 + k); }
    const fy = { id: id, name: (d.name || '').trim() || id, start: start, end: end, freq: freq, status: 'open', periods: this.build(start, end, freq) };
    S.fiscalYears.push(fy);
    FP.audit('Created fiscal year', 'Fiscal year', id, FP.fmt.date(start) + ' to ' + FP.fmt.date(end) + ', ' + FP.FREQ[freq].label.toLowerCase() + ' periods plus adjustment period');
    FP.touch(); return fy;
  },
  update(id, d) {
    FP.need('master');
    const fy = this.get(id); if (!fy) throw FP.E('Fiscal year not found.');
    if (d.name != null) { const n = String(d.name).trim(); if (!n) throw FP.E('Name cannot be empty.'); fy.name = n; }
    if ((d.start && d.start !== fy.start) || (d.end && d.end !== fy.end) || (d.freq && d.freq !== fy.freq)) {
      if (this.hasJournals(id)) throw FP.E('Dates and frequency cannot change once journals exist in the year.');
      const l = this.list(); const i = l.indexOf(fy);
      const start = d.start || fy.start, end = d.end || fy.end, freq = d.freq || fy.freq;
      if (!FP.D.valid(start) || !FP.D.valid(end) || end <= start) throw FP.E('Enter a valid start date and a later end date.');
      if (i > 0 && start !== FP.D.addDays(l[i - 1].end, 1)) throw FP.E('The start date must follow the previous year end.');
      if (i < l.length - 1 && end !== FP.D.addDays(l[i + 1].start, -1)) throw FP.E('The end date must meet the start of the following year.');
      fy.start = start; fy.end = end; fy.freq = freq; fy.periods = this.build(start, end, freq);
    }
    FP.audit('Updated fiscal year', 'Fiscal year', id, fy.name); FP.touch(); return fy;
  },
  remove(id) {
    FP.need('master');
    const fy = this.get(id); if (!fy) throw FP.E('Fiscal year not found.');
    if (this.hasJournals(id)) throw FP.E('This year has journals. Only an empty year can be deleted.');
    const l = this.list(); if (l.length > 1 && l[l.length - 1] !== fy && l[0] !== fy) throw FP.E('Only the first or last fiscal year can be deleted, so that years stay continuous.');
    FP.S.fiscalYears.splice(FP.S.fiscalYears.indexOf(fy), 1);
    FP.archive('fiscalYear', fy.name, fy); FP.audit('Deleted fiscal year', 'Fiscal year', id, fy.name); FP.touch();
  },
  unposted(fyId, pno) { return FP.S.journals.filter(j => j.fy === fyId && (pno == null || j.period === pno) && (j.status === 'draft' || j.status === 'submitted' || j.status === 'reviewed')); },
  setStatus(fyId, no, status, reason) {
    FP.need('period');
    const fy = this.get(fyId); if (!fy) throw FP.E('Fiscal year not found.');
    const p = this.period(fy, no); if (!p) throw FP.E('Period not found.');
    if (fy.status === 'closed') throw FP.E(fy.name + ' has been closed at year end. Re-open the year first.');
    if (status === 'closed') {
      if (p.status === 'closed') return p;
      const u = this.unposted(fyId, no);
      if (u.length) throw FP.E(u.length + ' journal(s) in ' + p.name + ' are still unposted (' + u.slice(0, 3).map(j => j.no).join(', ') + (u.length > 3 ? ', ...' : '') + '). Post, reject or delete them before closing.');
      p.status = 'closed'; p.closedAt = FP.now(); p.closedBy = FP.user().id;
      FP.audit(p.reopened ? 'Re-closed period' : 'Closed period', 'Period', fy.id + ' ' + p.name, reason || '');
    } else {
      if (p.status === 'open') return p;
      if (!String(reason || '').trim()) throw FP.E('State the reason for re-opening the period. It is kept in the audit log.');
      p.status = 'open'; p.reopened = (p.reopened || 0) + 1; p.reopenReason = reason;
      FP.audit('Re-opened period', 'Period', fy.id + ' ' + p.name, reason);
    }
    FP.touch(); return p;
  }
};

/* ---------------------------------------------------------------------
   Currencies and exchange rates
   Rates are quoted as units of functional currency per 1 unit of foreign currency.
   A rate can be held for a day, month, quarter, half-year or year. Lookup uses the
   most specific rate available for the date.
   --------------------------------------------------------------------- */
FP.RFREQ = { D: 'Daily', M: 'Monthly', Q: 'Quarterly', H: 'Semi-annual', Y: 'Yearly' };
FP.Rates = {
  missing: {},
  key(freq, date) {
    const y = date.slice(0, 4), m = +date.slice(5, 7);
    if (freq === 'D') return date; if (freq === 'M') return date.slice(0, 7);
    if (freq === 'Q') return y + '-Q' + Math.ceil(m / 3); if (freq === 'H') return y + '-H' + (m <= 6 ? 1 : 2); return y;
  },
  keyLabel(freq, key) { if (freq === 'D') return FP.fmt.date(key); if (freq === 'M') return FP.fmt.ym(key); return key.replace('-', ' '); },
  keyEnd(freq, key) {
    if (freq === 'D') return key; if (freq === 'M') return FP.D.eom(key + '-01');
    const y = key.slice(0, 4);
    if (freq === 'Q') return FP.D.eom(y + '-' + FP.pad(+key.slice(6) * 3, 2) + '-01');
    if (freq === 'H') return key.slice(6) === '1' ? y + '-06-30' : y + '-12-31';
    return y + '-12-31';
  },
  idx() { return FP.memo('rates.idx', () => { const m = new Map(); for (const r of FP.S.rates) m.set(r.cur + '|' + r.freq + '|' + r.key, r); return m; }); },
  sorted(cur) { return FP.memo('rates.sorted:' + cur, () => FP.S.rates.filter(r => r.cur === cur).map(r => ({ r: r, end: FP.Rates.keyEnd(r.freq, r.key) })).sort((a, b) => a.end < b.end ? -1 : a.end > b.end ? 1 : 0)); },
  get(cur, date, kind) {
    const fn = FP.S.settings.functional; if (!cur || cur === fn) return 1;
    kind = kind || 'closing';
    return FP.memo('rate:' + cur + ':' + date + ':' + kind, () => {
      const idx = this.idx();
      for (const f of ['D', 'M', 'Q', 'H', 'Y']) {
        const r = idx.get(cur + '|' + f + '|' + this.key(f, date));
        if (r) { const v = +r[kind] > 0 ? +r[kind] : (+r.closing > 0 ? +r.closing : +r.average); if (v > 0) return v; }
      }
      /* nearest earlier rate, else earliest later one */
      const all = this.sorted(cur); let best = null;
      for (const x of all) { if (x.end <= date) best = x; else { if (!best) best = x; break; } }
      if (best) { const v = +best.r[kind] > 0 ? +best.r[kind] : +best.r.closing; if (v > 0) return v; }
      this.missing[cur] = true; return 1;
    });
  },
  set(d) {
    FP.need('master');
    const S = FP.S; if (!S.currencies.find(c => c.code === d.cur)) throw FP.E('Add the currency first.');
    if (d.cur === S.settings.functional) throw FP.E('The functional currency always has a rate of 1.');
    if (!FP.RFREQ[d.freq]) throw FP.E('Choose a rate frequency.');
    const key = d.key || this.key(d.freq, d.date);
    const closing = FP.num(d.closing), average = FP.num(d.average) || closing;
    if (!(closing > 0)) throw FP.E('Enter a closing rate above zero.');
    let r = S.rates.find(x => x.cur === d.cur && x.freq === d.freq && x.key === key);
    if (r) { r.closing = closing; r.average = average; } else { r = { id: FP.uid('R'), cur: d.cur, freq: d.freq, key: key, closing: closing, average: average }; S.rates.push(r); }
    delete this.missing[d.cur];
    FP.audit('Saved exchange rate', 'Exchange rate', d.cur + ' ' + key, 'Closing ' + closing + ', average ' + average); FP.touch(); return r;
  },
  remove(id) {
    FP.need('master');
    const S = FP.S; const i = S.rates.findIndex(r => r.id === id); if (i < 0) return;
    const r = S.rates[i]; S.rates.splice(i, 1);
    FP.archive('rate', r.cur + ' ' + r.key, r); FP.audit('Deleted exchange rate', 'Exchange rate', r.cur + ' ' + r.key, ''); FP.touch();
  }
};

/* ---------------------------------------------------------------------
   Journals: creation, validation, approval workflow, posting, reversal
   --------------------------------------------------------------------- */
FP.JTYPES = {
  GJ: 'General journal', CR: 'Cash receipt', CP: 'Cash payment', TRF: 'Funds transfer', SI: 'Sales invoice', PI: 'Purchase bill',
  INV: 'Inventory movement', PRD: 'Production', DEP: 'Depreciation', AMO: 'Amortisation', PPD: 'Prepayment release', ACR: 'Accrual',
  FXR: 'FX revaluation', AST: 'Asset transaction', REV: 'Reversal', CLS: 'Year-end closing', OPN: 'Opening balances'
};
FP.JSTATUS = { draft: 'Draft', submitted: 'Awaiting review', reviewed: 'Awaiting approval', posted: 'Posted', rejected: 'Rejected', void: 'Void' };
FP.MODNAMES = { inv: 'Inventory', asset: 'Asset Register', run: 'Period Close', prepaid: 'Prepayments', accrual: 'Accruals', close: 'Year-end close' };

FP.Jn = {
  map() { return FP.memo('jn.map', () => FP.by(FP.S.journals, 'id')); },
  get(id) { return this.map().get(id); },
  nextNo(type, fyId) { return type + '-' + fyId.replace(/^FY/, '') + '-' + FP.pad(FP.seq('jn:' + type + ':' + fyId), 4); },
  resolve(date, adj, fyId) {
    if (!FP.D.valid(date)) throw FP.E('Enter a valid journal date.');
    if (adj) {
      const fy = (fyId && FP.FY.get(fyId)) || FP.FY.byDate(date); if (!fy) throw FP.E('No fiscal year covers that date.');
      return { fy: fy, p: FP.FY.adj(fy), date: fy.end };
    }
    const r = FP.FY.periodOf(date);
    if (!r) throw FP.E('No fiscal period covers ' + FP.fmt.date(date) + '. Create the fiscal year in the Setup Hub first.');
    return { fy: r.fy, p: r.p, date: date };
  },
  normalize(d) {
    const S = FP.S, fn = S.settings.functional;
    const r = this.resolve(d.date, d.adj, d.fy);
    const j = { type: d.type || 'GJ', date: r.date, fy: r.fy.id, period: r.p.no, narration: String(d.narration || '').trim(), ref: String(d.ref || '').trim(), cur: d.cur || fn, rate: 1, lines: [] };
    if (j.cur !== fn) {
      j.rate = FP.num(d.rate) || FP.Rates.get(j.cur, j.date, 'closing');
      if (!(j.rate > 0)) throw FP.E('Enter the exchange rate for ' + j.cur + '.');
    }
    for (const l of (d.lines || [])) {
      if (!l || !l.acc) continue;
      let dr = FP.r2(FP.num(l.dr)), cr = FP.r2(FP.num(l.cr));
      if (dr < 0) { cr = FP.r2(cr - dr); dr = 0; }
      if (cr < 0) { dr = FP.r2(dr - cr); cr = 0; }
      if (dr > 0 && cr > 0) { if (dr >= cr) { dr = FP.r2(dr - cr); cr = 0; } else { cr = FP.r2(cr - dr); dr = 0; } }
      if (dr === 0 && cr === 0 && !l.keepZero) continue;
      const line = { acc: l.acc, dr: dr, cr: cr };
      if (j.cur !== fn) { line.fdr = dr; line.fcr = cr; line.dr = FP.r2(dr * j.rate); line.cr = FP.r2(cr * j.rate); }
      if (l.memo) line.memo = String(l.memo).trim();
      if (l.party) line.party = l.party;
      if (l.dims) { const dm = {}; let any = false; for (const k of Object.keys(l.dims)) if (l.dims[k]) { dm[k] = l.dims[k]; any = true; } if (any) line.dims = dm; }
      const a = FP.Coa.get(l.acc);
      if (a && a.cur && a.cur !== fn) {
        if (l.fc != null && l.fc !== '') line.fc = FP.r2(FP.num(l.fc));
        else if (a.cur === j.cur) line.fc = FP.r2((line.fdr || 0) - (line.fcr || 0));
        else line.fc = FP.r2((line.dr - line.cr) / FP.Rates.get(a.cur, j.date, 'closing'));
      }
      j.lines.push(line);
    }
    if (j.cur !== fn && j.lines.length) {
      /* absorb conversion rounding (a few kobo) into the largest line so the functional entry balances */
      const diff = FP.r2(FP.sum(j.lines, l => l.dr) - FP.sum(j.lines, l => l.cr));
      if (diff !== 0 && Math.abs(diff) <= 0.02 * j.lines.length + 0.05) {
        const side = diff > 0 ? 'dr' : 'cr'; let big = null;
        for (const l of j.lines) if (l[side] > 0 && (!big || l[side] > big[side])) big = l;
        if (big) big[side] = FP.r2(big[side] - Math.abs(diff));
      }
    }
    if (d.autoRev) j.autoRev = d.autoRev;
    if (d.src) j.src = d.src;
    if (d.sys) j.sys = true;
    return j;
  },
  validate(j, o) {
    o = o || {}; const S = FP.S, fn = S.settings.functional;
    if (j.lines.length < 2) throw FP.E('A journal needs at least two lines: one debit and one credit.');
    if (!j.narration) throw FP.E('Add a narration so the entry can be understood later.');
    let dr = 0, cr = 0, fdr = 0, fcr = 0;
    for (const l of j.lines) {
      const a = FP.Coa.get(l.acc);
      if (!a) throw FP.E('Account ' + l.acc + ' does not exist in the chart of accounts.');
      if (a.ctl) throw FP.E(l.acc + ' ' + a.name + ' is a control (FS line) account. Post to one of its note lines instead.');
      if (a.active === false && !o.sys) throw FP.E('Account ' + l.acc + ' ' + a.name + ' is inactive.');
      if (l.dr > 0 && l.cr > 0) throw FP.E('A line cannot carry both a debit and a credit.');
      if (a.partyType && !l.party && !o.sys) throw FP.E('Select a ' + (a.partyType === 'C' ? 'customer' : 'supplier') + ' on the line for ' + l.acc + ' ' + a.name + ' so the sub-ledger stays in step with the control account.');
      if (l.party && !S.parties.find(p => p.id === l.party)) throw FP.E('A line refers to a customer or supplier that no longer exists.');
      dr += l.dr; cr += l.cr; fdr += l.fdr || 0; fcr += l.fcr || 0;
    }
    if (!FP.near(dr, cr)) throw FP.E('The journal is out of balance by ' + FP.fmt.num(Math.abs(dr - cr)) + '. Total debits must equal total credits.');
    if (j.cur !== fn && !FP.near(fdr, fcr)) throw FP.E('The journal is out of balance in ' + j.cur + ' by ' + FP.fmt.num(Math.abs(fdr - fcr)) + '.');
    if (FP.r2(dr) === 0) throw FP.E('The journal has no value.');
    if (j.type === 'OPN' && !j.sys && FP.FY.prev(j.fy)) throw FP.E('Opening balance journals belong to the first fiscal year only. Later years receive their opening balances from the year-end roll-forward.');
    if (j.autoRev) { if (!FP.D.valid(j.autoRev) || j.autoRev <= j.date) throw FP.E('The auto-reverse date must fall after the journal date.'); }
  },
  checkOpen(j, o) {
    o = o || {};
    const fy = FP.FY.get(j.fy); const p = FP.FY.period(fy, j.period);
    if (o.sys && (j.type === 'OPN' || j.type === 'CLS')) return;
    if (fy.status === 'closed') throw FP.E(fy.name + ' is closed. Re-open the year in Period Close before posting into it.');
    if (p.status !== 'open') throw FP.E(p.name + ' (' + fy.name + ') is closed. Re-open the period in Period Close, or use a date in an open period.');
  },
  create(d, o) {
    o = o || {};
    if (!o.sys && !o.auto) FP.need('journal.draft');
    const j = this.normalize(d);
    if (!j.lines.length) throw FP.E('Add at least one journal line with an account and an amount.');
    if (o.post) { this.validate(j, o); this.checkOpen(j, o); }
    j.id = FP.uid('J'); j.no = this.nextNo(j.type, j.fy); j.status = 'draft'; j.by = o.by || FP.user().id; j.at = FP.now();
    FP.S.journals.push(j); FP.bump();
    if (o.post) this._post(j, o);
    else { FP.audit('Saved draft journal', 'Journal', j.no, j.narration); FP.touch(); }
    return j;
  },
  update(id, d) {
    FP.need('journal.draft');
    const o = this.get(id); if (!o) throw FP.E('Journal not found.');
    if (o.status !== 'draft' && o.status !== 'rejected') throw FP.E('Only draft or rejected journals can be edited. Reverse a posted journal instead.');
    const j = this.normalize(Object.assign({}, d, { type: d.type || o.type }));
    if (!j.lines.length) throw FP.E('Add at least one journal line with an account and an amount.');
    const keepNo = (j.fy === o.fy && j.type === o.type);
    Object.assign(o, { type: j.type, date: j.date, fy: j.fy, period: j.period, narration: j.narration, ref: j.ref, cur: j.cur, rate: j.rate, lines: j.lines });
    if (j.autoRev) o.autoRev = j.autoRev; else delete o.autoRev;
    if (!keepNo) o.no = this.nextNo(o.type, o.fy);
    if (o.status === 'rejected') { o.status = 'draft'; delete o.rejectReason; }
    o.editedAt = FP.now();
    FP.audit('Edited draft journal', 'Journal', o.no, o.narration); FP.touch(); return o;
  },
  _post(j, o) {
    o = o || {};
    this.validate(j, o); this.checkOpen(j, o);
    j.status = 'posted'; j.postedAt = FP.now();
    if (!j.approvedBy) { j.approvedBy = o.sys ? 'SYS' : FP.user().id; j.approvedAt = j.postedAt; }
    if (o.auto) j.autoPosted = true;
    FP.audit(o.label || 'Posted journal', 'Journal', j.no, j.narration + ' (' + FP.fmt.num(FP.sum(j.lines, l => l.dr)) + ')');
    FP.touch();
    if (j.autoRev && !j.autoRevJid) this._autoReverse(j);
  },
  _autoReverse(j) {
    const r = this._reversal(j, j.autoRev, 'Auto-reversal of ' + j.no + ': ' + j.narration);
    let ready = false;
    try { const rs = this.resolve(j.autoRev, false); r.fy = rs.fy.id; r.period = rs.p.no; r.date = rs.date; ready = true; } catch (e) { ready = false; }
    r.id = FP.uid('J'); r.no = this.nextNo('REV', r.fy); r.by = j.by; r.at = FP.now(); r.status = 'draft'; r.reversalOf = j.id; r.autoOf = j.id;
    if (j.src) r.src = FP.clone(j.src);
    FP.S.journals.push(r); FP.bump(); j.autoRevJid = r.id;
    if (ready) { try { this._post(r, { sys: true, label: 'Posted auto-reversal' }); r.approvedBy = j.approvedBy; j.reversedBy = r.id; return; } catch (e) { /* period closed: leave pending */ } }
    r.pendingAuto = true; FP.audit('Scheduled auto-reversal', 'Journal', r.no, 'Waiting for an open period on ' + FP.fmt.date(r.date)); FP.touch();
  },
  _reversal(o, date, narration) {
    let fy, p, dt;
    try { const r = this.resolve(date, false); fy = r.fy; p = r.p; dt = r.date; }
    catch (e) { fy = FP.FY.byDate(date); p = fy ? fy.periods.find(x => !x.adj && x.start <= date && date <= x.end) : null; dt = date; }
    const fn = FP.S.settings.functional;
    const j = { type: 'REV', date: dt, fy: fy ? fy.id : o.fy, period: p ? p.no : o.period, narration: narration, ref: o.no, cur: o.cur, rate: o.rate, lines: [] };
    for (const l of o.lines) {
      const n = { acc: l.acc, dr: l.cr, cr: l.dr };
      if (o.cur !== fn) { n.fdr = l.fcr || 0; n.fcr = l.fdr || 0; }
      if (l.memo) n.memo = l.memo; if (l.party) n.party = l.party; if (l.dims) n.dims = FP.clone(l.dims);
      if (l.fc != null) n.fc = FP.r2(-l.fc);
      j.lines.push(n);
    }
    return j;
  },
  /* pending auto-reversals are posted as soon as their period exists and is open */
  postPending() {
    let n = 0;
    for (const r of FP.S.journals) if (r.pendingAuto && r.status === 'draft') {
      try {
        const rs = this.resolve(r.date, false); r.fy = rs.fy.id; r.period = rs.p.no;
        this._post(r, { sys: true, label: 'Posted auto-reversal' }); delete r.pendingAuto;
        const o = this.get(r.reversalOf); if (o) o.reversedBy = r.id; n++;
      } catch (e) { /* still waiting */ }
    }
    return n;
  },
  submit(id) {
    FP.need('journal.draft');
    const j = this.get(id); if (!j) throw FP.E('Journal not found.');
    if (j.status !== 'draft' && j.status !== 'rejected') throw FP.E('Only draft journals can be submitted.');
    this.validate(j); this.checkOpen(j);
    const wf = FP.S.settings.workflow;
    if (wf === 'direct') { this._post(j, {}); return j; }
    j.status = 'submitted'; j.submittedAt = FP.now(); j.submittedBy = FP.user().id; delete j.rejectReason;
    FP.audit('Submitted journal for ' + (wf === 'three' ? 'review' : 'approval'), 'Journal', j.no, j.narration); FP.touch(); return j;
  },
  _sod(j, stage) {
    const S = FP.S, u = FP.user();
    if (!S.settings.sod || u.role === 'Admin') return;
    if (j.by === u.id) throw FP.E('Segregation of duties: you prepared this journal, so someone else must ' + stage + ' it.');
    if (stage === 'approve' && S.settings.workflow === 'three' && j.reviewedBy === u.id) throw FP.E('Segregation of duties: you reviewed this journal, so a different approver must post it.');
  },
  review(id) {
    FP.need('journal.review');
    const j = this.get(id); if (!j) throw FP.E('Journal not found.');
    if (FP.S.settings.workflow !== 'three') throw FP.E('The review step applies to the three-step workflow only.');
    if (j.status !== 'submitted') throw FP.E('Only submitted journals can be reviewed.');
    this._sod(j, 'review');
    j.status = 'reviewed'; j.reviewedBy = FP.user().id; j.reviewedAt = FP.now();
    FP.audit('Reviewed journal', 'Journal', j.no, j.narration); FP.touch(); return j;
  },
  approve(id) {
    FP.need('journal.approve');

  provisional(fyId) { const prev = FP.FY.prev(fyId); return !!(prev && !this.index(false).__sysOpn[fyId]); },

  closingAll(fyId, unposted) {

/* ---------------------------------------------------------------------
   Year-end close: close income and expense to equity in the adjustment period,

  checks(fyId) {

    const t = FP.Ledger.tb(fyId, 1, FP.FY.adj(fy).no, {}); let s = 0; for (const r of t.values()) s += r.close;
    out.push({ key: 'tb', label: 'Trial balance agrees', ok: FP.near(s, 0, 0.01), hard: true, note: FP.near(s, 0, 0.01) ? 'Debits equal credits.' : 'Out of balance by ' + FP.fmt.num(s) + '.' });
    const openP = fy.periods.filter(p => !p.adj && p.status === 'open');
    out.push({ key: 'periods', label: 'Regular periods are closed', ok: openP.length === 0, hard: false, note: openP.length ? openP.length + ' period(s) still open. They will be closed with the year.' : 'All regular periods closed.' });

  /* ---------------- Statement of cash flows (indirect method) ---------------- */

      for (const a of adjLines) add('op', a.key, a.label, a.amt, 'adj');
      add('op', 'adj:fincost', 'Finance costs', fcost, 'adj'); add('op', 'adj:finincome', 'Finance income', finc, 'adj');
      let taxFlow = -tax, cashOpen = 0, cashClose = 0;
      const proceedsByFs = FP.Assets ? FP.Assets.disposalProceeds(from, to) : new Map();
      for (const f of ctl) {

  cf(q) {

  RATIO_DEFS: [

    { k: 'opMargin', n: 'Operating profit margin', f: 'pct', g: 'Profitability', hi: true, formula: 'Operating profit / Revenue', read: 'What the core business earns before financing and tax. It tests whether overheads are growing faster than sales.' },
    { k: 'ebitdaMargin', n: 'EBITDA margin', f: 'pct', g: 'Profitability', hi: true, formula: '(Operating profit + Depreciation and amortisation) / Revenue', read: 'A cash-leaning view of operating performance, often used by lenders.' },
    { k: 'netMargin', n: 'Net profit margin', f: 'pct', g: 'Profitability', hi: true, formula: 'Profit for the period / Revenue', read: 'What finally belongs to the owners out of each Naira of sales.' },
    { k: 'roe', n: 'Return on equity (annualised)', f: 'pct', g: 'Profitability', hi: true, formula: 'Profit for the period x (365 / days) / Total equity', read: 'The return the owners earn on the capital they have left in the business.' },
    { k: 'roa', n: 'Return on assets (annualised)', f: 'pct', g: 'Profitability', hi: true, formula: 'Profit for the period x (365 / days) / Total assets', read: 'How hard the asset base is working, regardless of how it is financed.' },
    { k: 'current', n: 'Current ratio', f: 'x', g: 'Liquidity', hi: true, formula: 'Current assets / Current liabilities', read: 'Cover for obligations due within a year. Below 1.0x signals pressure; well above 2.0x may mean idle resources.' },

    { k: 'dso', n: 'Receivable days', f: 'days', g: 'Working capital', hi: false, formula: 'Trade receivables / Revenue x days in period', read: 'Average time customers take to pay. Compare with your credit terms; rising days tie up cash.' },

    { k: 'interestCover', n: 'Interest cover', f: 'x', g: 'Solvency', hi: true, formula: 'Operating profit / Finance costs', read: 'How many times operating profit covers interest. Lenders often look for 3.0x or more.' },

  ratioFmt(def, v) { return def.f === 'pct' ? FP.fmt.pct(v) : def.f === 'x' ? FP.fmt.x(v) : FP.fmt.days(v); },

  },

      for (const r of h.rows) rows.push({ k: 'row', c: { date: FP.fmt.date(r.date), no: r.no || '', type: r.type || '', narration: r.narration + (r.party ? ' [' + pn(r.party) + ']' : ''), dr: r.dr || null, cr: r.cr || null, bal: r.bal }, drill: r.jid ? { t: 'jn', id: r.jid } : null, soft: r.synthetic });

  /* ---------------- Multi-year summary ---------------- */
  years(cur) { return FP.FY.list().map(fy => { const adj = FP.FY.adj(fy).no; const pl = this.pl({ fy: fy.id, p1: 1, p2: adj, cur: cur }); const bs = this.bs({ fy: fy.id, p1: 1, p2: adj, cur: cur }); return { fy: fy, T: pl.T, B: bs.T }; }); },

};
/* =====================================================================
   Registers and their calculation engines:
   - Asset register (PPE and intangibles) with componentisation (IAS 16 / IAS 38)
   - Prepayments (prepaid expenses)
   - Accrued expenses with optional reversing journals
   - Foreign currency revaluation of monetary balances (IAS 21)
   Each engine calculates what is due for a month, compares it with what has
   already been posted, and journals only the difference. Changes therefore
   take effect prospectively and missed months are caught up automatically.
   ===================================================================== */
FP.Assets = {
  KIND: {
    ppe: { label: 'Property, plant and equipment', short: 'PPE', charge: 'Depreciation', jt: 'DEP', verb: 'depreciated' },
    int: { label: 'Intangible assets', short: 'Intangibles', charge: 'Amortisation', jt: 'AMO', verb: 'amortised' }
  },
  METHODS: { SL: 'Straight-line', RB: 'Reducing balance', NONE: 'Not depreciated' },
  EVENTS: { addition: 'Subsequent expenditure', revaluation: 'Revaluation', impairment: 'Impairment', disposal: 'Disposal', revise: 'Change in estimate', pause: 'Depreciation paused', resume: 'Depreciation resumed', reclass: 'Reclassification' },
  cls(id) { return FP.S.assetClasses.find(c => c.id === id); },
  get(id) { return FP.S.assets.find(a => a.id === id); },
  list(kind) { return FP.S.assets.filter(a => a.kind === kind); },
  comp(a, id) { return a.comps.find(c => c.id === id); },
  /* class in force on a given date (after reclassifications up to and including that date) */
  classOn(asset, date) { let c = asset.classId; for (const e of asset.events || []) if (e.type === 'reclass' && e.date <= date) c = e.to; return c; },
  currentClass(asset) { return this.classOn(asset, '9999-12-31'); },

  /* ---- the simulation: month-by-month life of one component ----
     Rules: depreciation runs in whole months. Events dated on the last day of a month
     take effect after that month's charge; any other date takes effect before the
     charge of the month it falls in. Straight-line spreads the remaining depreciable
     amount over the remaining life, so revisions, revaluations, impairments and
     additions flow into future charges automatically. */
  simulate(asset, comp, o) {
    o = o || {};

    return FP.memo(key, () => {
      const D = FP.D, r2 = FP.r2; const conv = FP.S.settings.depConvention;
      const startYm = conv === 'next-month' ? D.ymAdd(D.ym(comp.start), 1) : D.ym(comp.start);
      const takeOn = !!comp.takeOn || (comp.openAcc || 0) > 0;
      const acqYm = D.ym(asset.acqDate || comp.acq || comp.start);
      const evs = [];
      (comp.events || []).forEach((e, i) => evs.push({ e: e, i: i, o: 1 }));
      (asset.events || []).forEach((e, i) => { if (e.type === 'reclass') evs.push({ e: e, i: i, o: 0 }); });
      if (o.probe) evs.push({ e: { type: 'probe', date: o.probe }, i: 1e9, o: 2 });
      evs.sort((a, b) => a.e.date < b.e.date ? -1 : a.e.date > b.e.date ? 1 : (a.o - b.o) || (a.i - b.i));
      let t0 = takeOn ? D.ym(comp.start) : (acqYm < D.ym(comp.start) ? acqYm : D.ym(comp.start));
      if (evs.length && D.ym(evs[0].e.date) < t0) t0 = D.ym(evs[0].e.date);
      const st = { cost: takeOn ? comp.cost : 0, acc: takeOn ? (comp.openAcc || 0) : 0, resid: comp.resid || 0, method: comp.method || 'SL', rem: comp.lifeM || 0, rate: comp.rate || 0, paused: false, disposed: false, surplus: comp.openSurplus || 0, cls: asset.classId, rbBase: 0, rbCount: 0, rbReset: true };
      let acquired = takeOn; const rows = []; let ei = 0, ymc = t0, n = 0, probe = null;
      const apply = (x, mv) => {
        const e = x.e;
        if (e.type === 'probe') { probe = { cost: st.cost, acc: st.acc, resid: st.resid, surplus: st.surplus, cls: st.cls, method: st.method, rem: st.rem, rate: st.rate, paused: st.paused, disposed: st.disposed, acquired: acquired }; return; }
        mv.ev.push(e.type);
        if (e.type === 'addition') { st.cost = r2(st.cost + e.amount); mv.add = r2(mv.add + e.amount); if (e.lifeM) st.rem = e.lifeM; st.rbReset = true; }
        else if (e.type === 'impairment') { const amt = Math.min(e.amount, r2(st.cost - st.acc)); st.acc = r2(st.acc + amt); mv.imp = r2(mv.imp + amt); st.rbReset = true; }
        else if (e.type === 'revaluation') {

          if (delta >= 0) st.surplus = r2(st.surplus + delta); else st.surplus = r2(st.surplus - Math.min(st.surplus, -delta));
          st.cost = r2(e.value); st.acc = 0; if (e.lifeM) st.rem = e.lifeM; if (e.resid != null && e.resid !== '') st.resid = e.resid; st.rbReset = true;
        }
        else if (e.type === 'disposal') {
          const f = Math.min(1, Math.max(0, (e.pct == null ? 100 : e.pct) / 100)); const dc = r2(st.cost * f), da = r2(st.acc * f);
          st.cost = r2(st.cost - dc); st.acc = r2(st.acc - da); st.surplus = r2(st.surplus * (1 - f)); st.resid = r2(st.resid * (1 - f));
          mv.disp = r2(mv.disp + dc); mv.dispAcc = r2(mv.dispAcc + da); if (f >= 1) st.disposed = true; st.rbReset = true;
        }
        else if (e.type === 'revise') { if (e.method) st.method = e.method; if (e.lifeM != null && e.lifeM !== '') st.rem = +e.lifeM; if (e.rate != null && e.rate !== '') st.rate = +e.rate; if (e.resid != null && e.resid !== '') st.resid = +e.resid; st.rbReset = true; }
        else if (e.type === 'pause') st.paused = true;
        else if (e.type === 'resume') st.paused = false;
        else if (e.type === 'reclass') { mv.reclass = { from: st.cls, to: e.to, cost: st.cost, acc: st.acc }; st.cls = e.to; }
      };
      while (n++ < 720) {
        const eom = D.eom(ymc + '-01');
        const mv = { ym: ymc, add: 0, reval: 0, disp: 0, dep: 0, imp: 0, dispAcc: 0, revalAcc: 0, cost0: st.cost, acc0: st.acc, cls: st.cls, ev: [], paused: false };
        if (!acquired && ymc >= acqYm) { st.cost = comp.cost; mv.add = comp.cost; acquired = true; }
        while (ei < evs.length && evs[ei].e.date < eom) apply(evs[ei++], mv);
        mv.cls = st.cls;
        if (acquired && !st.disposed && ymc >= startYm && st.method !== 'NONE') {
          if (st.paused) mv.paused = true;
          else {
            const ca = r2(st.cost - st.acc), depble = r2(ca - st.resid);

              else { if (st.rbReset || st.rbCount % 12 === 0) { st.rbBase = ca; st.rbReset = false; st.rbCount = 0; } dep = Math.min(depble, r2(st.rbBase * st.rate / 100 / 12)); st.rbCount++; }

        }
        while (ei < evs.length && evs[ei].e.date <= eom) apply(evs[ei++], mv);
        mv.cost = st.cost; mv.acc = st.acc; mv.nbv = r2(st.cost - st.acc); mv.clsEnd = st.cls; mv.rem = st.rem; mv.disposed = st.disposed; mv.surplus = st.surplus;
        rows.push(mv);
        const more = ei < evs.length;
        const spent = acquired && ymc >= startYm && (st.disposed || st.method === 'NONE' || r2(st.cost - st.acc - st.resid) <= 0.004 || (st.method === 'RB' && mv.dep < 0.01 && !mv.paused));
        if (!more && (spent || (st.paused && ymc >= startYm))) break;
        ymc = D.ymAdd(ymc, 1);
      }
      return { rows: rows, probe: probe, startYm: startYm };
    });
  },
  stateAt(asset, comp, ym) {
    const rows = this.simulate(asset, comp).rows; let last = null;
    for (const r of rows) { if (r.ym <= ym) last = r; else break; }
    if (!last) return { cost: 0, acc: 0, nbv: 0, cls: asset.classId, disposed: false, exists: false, surplus: 0, rem: comp.lifeM || 0 };
    return { cost: last.cost, acc: last.acc, nbv: last.nbv, cls: last.clsEnd, disposed: last.disposed, exists: true, surplus: last.surplus, rem: last.rem };
  },
  position(asset, ym) {
    let cost = 0, acc = 0, all = true; const comps = [];
    for (const c of asset.comps) { const s = this.stateAt(asset, c, ym); cost += s.cost; acc += s.acc; if (!s.disposed) all = false; comps.push(Object.assign({ id: c.id, name: c.name }, s)); }
    return { cost: FP.r2(cost), acc: FP.r2(acc), nbv: FP.r2(cost - acc), disposed: all && asset.comps.length > 0, comps: comps, cls: this.classOn(asset, FP.D.eom(ym + '-01')) };
  },
  /* amounts journalled by runs labelled up to and including a month */
  postedTotal(comp, ym) { let t = 0; const p = comp.posted || {}; for (const k of Object.keys(p)) if (!ym || k <= ym) t += p[k]; return FP.r2(t); },
  /* charge due up to a month, less what has been journalled already */
  due(kind, ym) {
    const out = [];
    for (const a of this.list(kind)) for (const c of a.comps) {
      const rows = this.simulate(a, c).rows; let d = 0, cls = a.classId, month = 0;
      for (const r of rows) { if (r.ym > ym) break; d += r.dep; cls = r.cls; if (r.ym === ym) month = r.dep; }
      const amt = FP.r2(d - this.postedTotal(c, ym));
      if (Math.abs(amt) >= 0.01) out.push({ asset: a, comp: c, amount: amt, month: month, catchUp: FP.r2(amt - month), cls: cls });
    }
    return out;
  },
  run(kind, ym) {
    FP.need('run');
    const K = this.KIND[kind]; const list = this.due(kind, ym);
    if (!list.length) throw FP.E('Nothing to post: ' + K.charge.toLowerCase() + ' is already up to date for ' + FP.fmt.ym(ym) + '.');
    const agg = new Map();
    for (const x of list) { const c = this.cls(x.cls); if (!c) throw FP.E('Asset class missing for ' + x.asset.name + '.'); const k = c.expAcc + '|' + c.accAcc; FP.addTo(agg, k, x.amount); }
    const lines = [];
    for (const [k, v] of agg) { const p = k.split('|'); const amt = FP.r2(v); if (amt === 0) continue; if (amt > 0) { lines.push({ acc: p[0], dr: amt, cr: 0 }); lines.push({ acc: p[1], dr: 0, cr: amt }); } else { lines.push({ acc: p[1], dr: -amt, cr: 0 }); lines.push({ acc: p[0], dr: 0, cr: -amt }); } }
    const runId = FP.uid('RN');

    const total = FP.r2(FP.sum(list, x => x.amount));
    FP.S.runs.push({ id: runId, kind: kind === 'ppe' ? 'dep' : 'amort', ym: ym, jid: j.id, total: total, ts: FP.now(), user: FP.user().id, lines: list.map(x => ({ a: x.asset.id, c: x.comp.id, amt: x.amount })) });
    FP.touch(); return { journal: j, total: total, count: list.length };
  },

  /* ---- maintenance ---- */
  _checkComp(c, kind) {
    if (!String(c.name || '').trim()) throw FP.E('Name every component.');
    if (!(FP.num(c.cost) > 0)) throw FP.E('Component cost must be above zero.');
    if (!FP.D.valid(c.start)) throw FP.E('Give each component a valid start date for ' + this.KIND[kind].charge.toLowerCase() + '.');

      const kids = a.comps.map((c, i) => { const s = p.comps[i]; return { k: 'row', indent: 2, c: { tag: '', name: c.name, cls: this.METHODS[c.method] + (c.method === 'SL' ? ', ' + c.lifeM + ' months' : c.method === 'RB' ? ', ' + c.rate + '% a year' : ''), acq: FP.fmt.date(c.start), cost: s.cost, acc: s.acc, nbv: s.nbv, status: s.disposed ? 'Disposed' : '' } }; });
      rows.push({ k: 'row', c: { tag: a.tag, name: a.name, cls: cls.name || '', acq: FP.fmt.date(a.acqDate), cost: p.cost, acc: p.acc, nbv: p.nbv, status: p.disposed ? 'Disposed' : (a.comps.some(c => (this.simulate(a, c).rows.find(r => r.ym === ym) || {}).paused) ? 'Paused' : 'In use') }, kids: kids, drill: { t: 'asset', id: a.id } });
      tc += p.cost; ta += p.acc;
    }
    rows.push({ k: 'total', c: { tag: '', name: 'Total', cost: FP.r2(tc), acc: FP.r2(ta), nbv: FP.r2(tc - ta) } });
    return { id: 'reg-' + kind, title: K.label + ': Register', company: FP.S.company.name, subtitle: 'As at ' + FP.fmt.date(FP.D.eom(ym + '-01')), meta: ['Currency: ' + FP.S.settings.functional], columns: [{ key: 'tag', label: 'Tag', type: 'code' }, { key: 'name', label: 'Asset / component', type: 'text' }, { key: 'cls', label: 'Class / basis', type: 'text' }, { key: 'acq', label: 'Acquired / start', type: 'text' }, { key: 'cost', label: 'Cost or valuation', type: 'num' }, { key: 'acc', label: 'Accumulated ' + K.charge.toLowerCase(), type: 'num' }, { key: 'nbv', label: 'Carrying amount', type: 'num' }, { key: 'status', label: 'Status', type: 'text' }], rows: rows, wide: true };
  },
  addClass(d) {
    FP.need('master');
    if (!String(d.name || '').trim()) throw FP.E('Name the class.');
    for (const k of ['costAcc', 'accAcc', 'expAcc']) { const a = FP.Coa.get(d[k]); if (!a || a.ctl) throw FP.E('Choose posting accounts for cost, accumulated charge and expense.'); }
    const c = { id: FP.uid('CL'), kind: d.kind || 'ppe', name: String(d.name).trim(), costAcc: d.costAcc, accAcc: d.accAcc, expAcc: d.expAcc, method: d.method || 'SL', lifeM: Math.round(FP.num(d.lifeM)) || 60, rate: FP.num(d.rate) || 0, residPct: FP.num(d.residPct) || 0 };

  },
  updateClass(id, d) {

    for (const k of ['costAcc', 'accAcc', 'expAcc']) if (d[k]) { const a = FP.Coa.get(d[k]); if (!a || a.ctl) throw FP.E('Choose posting accounts.'); c[k] = d[k]; }
    if (d.name != null) { if (!String(d.name).trim()) throw FP.E('Name the class.'); c.name = String(d.name).trim(); }

  },
  removeClass(id) {

    FP.S.assetClasses.splice(FP.S.assetClasses.indexOf(c), 1); FP.archive('assetClass', c.name, c); FP.audit('Deleted asset class', 'Asset classes', c.name, ''); FP.touch();
