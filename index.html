/* ---------------------------------------------------------------------
   Runs: shared history and reversal for all month-end engines
   --------------------------------------------------------------------- */
FP.Runs = {
  LABEL: { dep: 'Depreciation', amort: 'Amortisation', prepay: 'Prepayment release', accrual: 'Accruals', fx: 'FX revaluation' },
  get(id) { return FP.S.runs.find(r => r.id === id); },
  list(kind) { return FP.S.runs.filter(r => !kind || r.kind === kind).slice().sort((a, b) => a.ym < b.ym ? 1 : a.ym > b.ym ? -1 : (a.id < b.id ? 1 : -1)); },
  done(kind, ym) { return FP.S.runs.some(r => r.kind === kind && r.ym === ym && !r.reversed); },
  reverse(id) {
    FP.need('run');
    const r = this.get(id); if (!r) throw FP.E('Run not found.'); if (r.reversed) throw FP.E('This run has already been reversed.');
    const jids = r.jids || (r.jid ? [r.jid] : []);
    for (const jid of jids) { const j = FP.Jn.get(jid); if (j && j.autoRevJid) { const ar = FP.Jn.get(j.autoRevJid); if (ar && ar.status === 'posted') throw FP.E('The reversing journal ' + ar.no + ' has already posted, so this accrual has unwound itself. Correct the month with an adjusting journal instead.'); } }
    for (const jid of jids) { const j = FP.Jn.get(jid); if (j && j.status === 'posted' && !j.reversedBy) { if (j.autoRevJid) { const ar = FP.Jn.get(j.autoRevJid); if (ar && ar.status === 'draft') { FP.S.journals.splice(FP.S.journals.indexOf(ar), 1); delete j.autoRevJid; delete j.autoRev; FP.bump(); } } FP.Jn.reverse(jid, { fromModule: true }); } }
    if (r.kind === 'dep' || r.kind === 'amort') for (const l of r.lines) { const a = FP.Assets.get(l.a), c = a && FP.Assets.comp(a, l.c); if (c && c.posted) { c.posted[r.ym] = FP.r2((c.posted[r.ym] || 0) - l.amt); if (c.posted[r.ym] === 0) delete c.posted[r.ym]; } }
    if (r.kind === 'prepay') for (const l of r.lines) { const p = FP.S.prepaids.find(x => x.id === l.id); if (p && p.posted) { p.posted[r.ym] = FP.r2((p.posted[r.ym] || 0) - l.amt); if (p.posted[r.ym] === 0) delete p.posted[r.ym]; } }
    if (r.kind === 'accrual') for (const l of r.lines) { const p = FP.S.accruals.find(x => x.id === l.id); if (p && p.posted) delete p.posted[r.ym]; }
    r.reversed = true; r.reversedAt = FP.now(); r.reversedBy = FP.user().id;
    FP.audit('Reversed month-end run', this.LABEL[r.kind], r.id, FP.fmt.ym(r.ym) + ', ' + FP.fmt.num(r.total)); FP.touch();
  }
};

/* ---------------------------------------------------------------------
   Prepayments (prepaid expenses): paid in advance, released to expense over the cover period
   --------------------------------------------------------------------- */
FP.Prepaid = {
  EVENTS: { adjust: 'Amount adjusted', extend: 'Cover period changed', pause: 'Release paused', resume: 'Release resumed', writeoff: 'Written off / terminated' },
  get(id) { return FP.S.prepaids.find(p => p.id === id); },
  schedule(p) {
    return FP.memo('pps:' + p.id, () => {
      const D = FP.D, r2 = FP.r2; let bal = p.amount, end = p.end, paused = false; const evs = (p.events || []).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      let ei = 0, m = D.ym(p.start), n = 0; const rows = [];
      while (n++ < 600) {
        const eom = D.eom(m + '-01'), som = m + '-01'; let written = false; const open = bal;
        while (ei < evs.length && evs[ei].date <= eom) { const e = evs[ei++]; if (e.type === 'adjust') bal = r2(bal + e.amount); else if (e.type === 'extend') end = e.end; else if (e.type === 'pause') paused = true; else if (e.type === 'resume') paused = false; else if (e.type === 'writeoff') written = true; }
        let charge = 0;
        if (written) charge = bal;
        else if (paused) end = D.addMonths(end, 1);
        else if (m > D.ym(end)) charge = bal;
        else if (p.basis === 'D') { const s = p.start > som ? p.start : som, e2 = end < eom ? end : eom; const dc = D.diffDays(s, e2) + 1, rem = D.diffDays(s, end) + 1; charge = rem <= dc ? bal : r2(bal * dc / rem); }
        else { const rem = D.ymDiff(m, D.ym(end)) + 1; charge = rem <= 1 ? bal : r2(bal / rem); }
        charge = r2(charge); bal = r2(bal - charge);
        rows.push({ ym: m, open: open, charge: charge, bal: bal, paused: paused && !written, written: written });
        if (written || (Math.abs(bal) < 0.005 && ei >= evs.length) || (paused && ei >= evs.length)) break;
        m = D.ymAdd(m, 1);
      }
      return rows;
    });
  },
  postedTotal(p, ym) { let t = 0; for (const k of Object.keys(p.posted || {})) if (!ym || k <= ym) t += p.posted[k]; return FP.r2(t); },
  balanceAt(p, ym) { if (ym < FP.D.ym(p.start)) return 0; let last = null; for (const r of this.schedule(p)) { if (r.ym <= ym) last = r; else break; } return last ? last.bal : p.amount; },
  create(d, o) {
    FP.need('register'); o = o || {};
    if (!String(d.name || '').trim()) throw FP.E('Describe the prepayment.');
    const amt = FP.r2(FP.num(d.amount)); if (!(amt > 0)) throw FP.E('Enter the amount paid in advance.');
    if (!FP.D.valid(d.start) || !FP.D.valid(d.end) || d.end < d.start) throw FP.E('Enter the cover period: a start date and a later end date.');
    for (const k of ['assetAcc', 'expAcc']) { const a = FP.Coa.get(d[k]); if (!a || a.ctl) throw FP.E('Choose the prepayment (asset) account and the expense account.'); }
    const p = { id: FP.uid('PP'), name: String(d.name).trim(), party: d.party || '', ref: d.ref || '', amount: amt, start: d.start, end: d.end, assetAcc: d.assetAcc, expAcc: d.expAcc, basis: d.basis === 'D' ? 'D' : 'M', events: [], posted: {}, status: 'active' };
    if (d.dims) p.dims = d.dims;
    if (o.fundAcc) { const j = FP.Jn.create({ type: 'CP', date: o.payDate || d.start, narration: 'Prepayment: ' + p.name, ref: p.ref, lines: [{ acc: p.assetAcc, dr: amt, cr: 0, memo: p.name }, { acc: o.fundAcc, dr: 0, cr: amt, party: o.partyId || undefined }], src: { mod: 'prepaid', id: p.id } }, { post: true, auto: true, label: 'Posted prepayment' }); p.jid = j.id; }
    FP.S.prepaids.push(p); FP.audit('Added prepayment', 'Prepayments register', p.id, p.name + ', ' + FP.fmt.num(amt)); FP.touch(); return p;
  },
  addEvent(id, ev) {
    FP.need('register');
    const p = this.get(id); if (!p) throw FP.E('Prepayment not found.');
    if (!FP.D.valid(ev.date)) throw FP.E('Enter the effective date.');
    if (!this.EVENTS[ev.type]) throw FP.E('Unknown event.');
    const e = { id: FP.uid('EV'), type: ev.type, date: ev.date, reason: String(ev.reason || '').trim(), by: FP.user().id, at: FP.now() };
    if (ev.type === 'adjust') {
      const amt = FP.r2(FP.num(ev.amount)); if (amt === 0) throw FP.E('Enter the adjustment (positive for a top-up, negative for a refund).');
      e.amount = amt;
      if (ev.fundAcc) { const j = FP.Jn.create({ type: amt > 0 ? 'CP' : 'CR', date: ev.date, narration: 'Prepayment ' + (amt > 0 ? 'top-up' : 'refund') + ': ' + p.name, lines: amt > 0 ? [{ acc: p.assetAcc, dr: amt, cr: 0 }, { acc: ev.fundAcc, dr: 0, cr: amt }] : [{ acc: ev.fundAcc, dr: -amt, cr: 0 }, { acc: p.assetAcc, dr: 0, cr: -amt }], src: { mod: 'prepaid', id: p.id } }, { post: true, auto: true, label: 'Posted prepayment adjustment' }); e.jid = j.id; }
    } else if (ev.type === 'extend') { if (!FP.D.valid(ev.end) || ev.end < ev.date) throw FP.E('Enter the new end of the cover period.'); e.end = ev.end; }
    else if ((ev.type === 'pause' || ev.type === 'writeoff') && !e.reason) throw FP.E('State the reason.');
    p.events.push(e); if (ev.type === 'writeoff') p.status = 'ended';
    FP.audit(this.EVENTS[ev.type], 'Prepayments register', p.id, p.name + (e.reason ? ': ' + e.reason : '')); FP.touch(); return e;
  },
  removeEvent(id, evId) {
    FP.need('register');
    const p = this.get(id); const i = p ? p.events.findIndex(e => e.id === evId) : -1; if (i < 0) throw FP.E('Event not found.');
    const e = p.events[i]; if (e.jid) { const j = FP.Jn.get(e.jid); if (j && j.status === 'posted' && !j.reversedBy) FP.Jn.reverse(e.jid, { fromModule: true }); }
    p.events.splice(i, 1); if (e.type === 'writeoff') p.status = 'active';
    FP.archive('prepaidEvent', p.name + ' ' + this.EVENTS[e.type], e, { prepaid: p.id }); FP.audit('Withdrew prepayment event', 'Prepayments register', p.id, this.EVENTS[e.type]); FP.touch();
  },
  remove(id) {
    FP.need('register');
    const p = this.get(id); if (!p) throw FP.E('Prepayment not found.');
    if (p.jid || Object.keys(p.posted || {}).length) throw FP.E('This prepayment has journals in the ledger. Write it off instead of deleting it.');
    FP.S.prepaids.splice(FP.S.prepaids.indexOf(p), 1); FP.archive('prepaid', p.name, p); FP.audit('Deleted prepayment', 'Prepayments register', p.id, p.name); FP.touch();
  },
  due(ym) {
    const out = [];
    for (const p of FP.S.prepaids) { let d = 0, month = 0; for (const r of this.schedule(p)) { if (r.ym > ym) break; d += r.charge; if (r.ym === ym) month = r.charge; } const amt = FP.r2(d - this.postedTotal(p, ym)); if (Math.abs(amt) >= 0.01) out.push({ p: p, amount: amt, month: month, catchUp: FP.r2(amt - month) }); }
    return out;
  },
  run(ym) {
    FP.need('run');
    const list = this.due(ym); if (!list.length) throw FP.E('Nothing to post: prepayments are released up to ' + FP.fmt.ym(ym) + '.');
    const lines = [];
    for (const x of list) { const a = x.amount; if (a > 0) { lines.push({ acc: x.p.expAcc, dr: a, cr: 0, memo: x.p.name, dims: x.p.dims }); lines.push({ acc: x.p.assetAcc, dr: 0, cr: a, memo: x.p.name }); } else { lines.push({ acc: x.p.assetAcc, dr: -a, cr: 0, memo: x.p.name }); lines.push({ acc: x.p.expAcc, dr: 0, cr: -a, memo: x.p.name, dims: x.p.dims }); } }
    const runId = FP.uid('RN');
    const j = FP.Jn.create({ type: 'PPD', date: FP.D.eom(ym + '-01'), narration: 'Release of prepayments for ' + FP.fmt.ym(ym), ref: runId, lines: lines, src: { mod: 'run', id: runId } }, { post: true, auto: true, label: 'Posted prepayment release run' });
    for (const x of list) { x.p.posted = x.p.posted || {}; x.p.posted[ym] = FP.r2((x.p.posted[ym] || 0) + x.amount); }
    const total = FP.r2(FP.sum(list, x => x.amount));
    FP.S.runs.push({ id: runId, kind: 'prepay', ym: ym, jid: j.id, total: total, ts: FP.now(), user: FP.user().id, lines: list.map(x => ({ id: x.p.id, amt: x.amount })) });
    FP.touch(); return { journal: j, total: total, count: list.length };
  },
  model(ym) {
    const rows = []; let ta = 0, tb = 0, tr = 0;
    for (const p of FP.S.prepaids) {
      const sch = this.schedule(p); let rel = 0, bal = p.amount; for (const r of sch) { if (r.ym > ym) break; rel += r.charge; bal = r.bal; }
      if (ym < FP.D.ym(p.start)) { bal = 0; }
      const adj = FP.sum((p.events || []).filter(e => e.type === 'adjust' && FP.D.ym(e.date) <= ym), e => e.amount);
      const gross = ym < FP.D.ym(p.start) ? 0 : FP.r2(p.amount + adj);
      rows.push({ k: 'row', c: { name: p.name, party: p.party, period: FP.fmt.date(p.start) + ' to ' + FP.fmt.date(p.end), basis: p.basis === 'D' ? 'Daily' : 'Monthly', amount: gross, released: FP.r2(rel), bal: bal, status: p.status === 'ended' ? 'Ended' : bal === 0 && gross ? 'Fully released' : 'Active' }, drill: { t: 'prepaid', id: p.id } });
      ta += gross; tr += rel; tb += bal;
    }
    rows.push({ k: 'total', c: { name: 'Total', amount: FP.r2(ta), released: FP.r2(tr), bal: FP.r2(tb) } });
    return { id: 'prepaid', title: 'Prepayments Register', company: FP.S.company.name, subtitle: 'As at ' + FP.fmt.date(FP.D.eom(ym + '-01')), meta: ['Currency: ' + FP.S.settings.functional], columns: [{ key: 'name', label: 'Prepayment', type: 'text' }, { key: 'party', label: 'Paid to', type: 'text' }, { key: 'period', label: 'Cover period', type: 'text' }, { key: 'basis', label: 'Basis', type: 'text' }, { key: 'amount', label: 'Amount paid', type: 'num' }, { key: 'released', label: 'Released to expense', type: 'num' }, { key: 'bal', label: 'Unexpired balance', type: 'num' }, { key: 'status', label: 'Status', type: 'text' }], rows: rows, wide: true };
  },
  recon(ym) {
    const date = FP.D.eom(ym + '-01'); const by = new Map();
    for (const p of FP.S.prepaids) { if (ym < FP.D.ym(p.start)) continue; let bal = p.amount; for (const r of this.schedule(p)) { if (r.ym > ym) break; bal = r.bal; } FP.addTo(by, p.assetAcc, bal); }
    const due = new Map(); for (const d of this.due(ym)) FP.addTo(due, d.p.assetAcc, d.amount);
    for (const k of due.keys()) if (!by.has(k)) by.set(k, 0);
    return Array.from(by.entries()).map(e => { const gl = FP.Ledger.balAt(e[0], date); const un = FP.r2(due.get(e[0]) || 0); return { acc: e[0], reg: FP.r2(e[1]), unposted: un, gl: gl, diff: FP.r2(e[1] + un - gl) }; });
  }
};

/* ---------------------------------------------------------------------
   Accrued expenses: recognised monthly; optionally reversed on the first day
   of the following month (a reversing journal) when the actual bill is expected
   --------------------------------------------------------------------- */
FP.Accrual = {
  get(id) { return FP.S.accruals.find(p => p.id === id); },
  create(d) {
    FP.need('register');
    if (!String(d.name || '').trim()) throw FP.E('Describe the accrual.');
    const amt = FP.r2(FP.num(d.amount)); if (!(amt > 0)) throw FP.E('Enter the monthly amount to accrue.');
    const s = String(d.start || '').slice(0, 7), e = String(d.end || '').slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(s) || !/^\d{4}-\d{2}$/.test(e) || e < s) throw FP.E('Enter the first and last month to accrue.');
    for (const k of ['liabAcc', 'expAcc']) { const a = FP.Coa.get(d[k]); if (!a || a.ctl) throw FP.E('Choose the accrual (liability) account and the expense account.'); }
    const p = { id: FP.uid('AC'), name: String(d.name).trim(), party: d.party || '', amount: amt, start: s, end: e, liabAcc: d.liabAcc, expAcc: d.expAcc, autoReverse: !!d.autoReverse, posted: {}, status: 'active' };
    if (d.dims) p.dims = d.dims;
    FP.S.accruals.push(p); FP.audit('Added accrual', 'Accruals register', p.id, p.name + ', ' + FP.fmt.num(amt) + ' a month' + (p.autoReverse ? ', auto-reversing' : '')); FP.touch(); return p;
  },
  update(id, d) {
    FP.need('register');
    const p = this.get(id); if (!p) throw FP.E('Accrual not found.');
    if (d.name != null) { if (!String(d.name).trim()) throw FP.E('Describe the accrual.'); p.name = String(d.name).trim(); }
    if (d.amount != null) { const a = FP.r2(FP.num(d.amount)); if (!(a > 0)) throw FP.E('Enter the monthly amount.'); p.amount = a; }
    if (d.end) { const e = String(d.end).slice(0, 7); if (e < p.start) throw FP.E('The last month cannot precede the first.'); p.end = e; }
    if (d.party != null) p.party = d.party;
    if ('autoReverse' in d) p.autoReverse = !!d.autoReverse;
    if (d.status) p.status = d.status;
    FP.audit('Updated accrual', 'Accruals register', p.id, p.name + ' (applies to months not yet posted)'); FP.touch(); return p;
  },
  remove(id) {
    FP.need('register');
    const p = this.get(id); if (!p) throw FP.E('Accrual not found.');
    if (Object.keys(p.posted || {}).length) throw FP.E('This accrual has been posted. End it instead of deleting it.');
    FP.S.accruals.splice(FP.S.accruals.indexOf(p), 1); FP.archive('accrual', p.name, p); FP.audit('Deleted accrual', 'Accruals register', p.id, p.name); FP.touch();
  },
  due(ym) { return FP.S.accruals.filter(p => p.status === 'active' && p.start <= ym && ym <= p.end && !(p.posted && p.posted[ym] != null)).map(p => ({ p: p, amount: p.amount })); },
  run(ym) {
    FP.need('run');
    const list = this.due(ym); if (!list.length) throw FP.E('Nothing to post: accruals are up to date for ' + FP.fmt.ym(ym) + '.');
    const date = FP.D.eom(ym + '-01'); const runId = FP.uid('RN'); const jids = [];
    for (const rev of [false, true]) {
      const part = list.filter(x => !!x.p.autoReverse === rev); if (!part.length) continue;
      const lines = []; for (const x of part) { lines.push({ acc: x.p.expAcc, dr: x.amount, cr: 0, memo: x.p.name, dims: x.p.dims }); lines.push({ acc: x.p.liabAcc, dr: 0, cr: x.amount, memo: x.p.name }); }
      const d = { type: 'ACR', date: date, narration: 'Accrued expenses for ' + FP.fmt.ym(ym) + (rev ? ' (reversing on ' + FP.fmt.date(FP.D.addDays(date, 1)) + ')' : ''), ref: runId, lines: lines, src: { mod: 'run', id: runId } };
      if (rev) d.autoRev = FP.D.addDays(date, 1);
      const j = FP.Jn.create(d, { post: true, auto: true, label: 'Posted accruals run' }); jids.push(j.id);
    }
    for (const x of list) { x.p.posted = x.p.posted || {}; x.p.posted[ym] = x.amount; }
    const total = FP.r2(FP.sum(list, x => x.amount));
    FP.S.runs.push({ id: runId, kind: 'accrual', ym: ym, jid: jids[0], jids: jids, total: total, ts: FP.now(), user: FP.user().id, lines: list.map(x => ({ id: x.p.id, amt: x.amount })) });
    FP.touch(); return { total: total, count: list.length, jids: jids };
  },
  model() {

  valuation(asAt) {

  },
  recon(asAt) {

  /* sales, cost and margin by item for a date range */
  analytics(from, to) {

};

/* ---------------- Bank and cash: cashbook and reconciliation ---------------- */
FP.Bank = {
  accounts() { return FP.Coa.postings().filter(a => a.bank); },
  cashAccounts() { return FP.Coa.postings().filter(a => { const f = FP.Coa.fs(a.code); return f && f.cf === 'cash'; }); },
  /* cashbook lines of a bank account, signed in the account's own currency */
  bookLines(acc) {
    return FP.memo('bank.book:' + acc, () => {
      const a = FP.Coa.get(acc); const fc = !!(a && a.cur); const out = [];
      for (const j of FP.S.journals) {
        if (j.status !== 'posted' || (j.type === 'OPN' && j.sys) || j.type === 'CLS') continue;
        for (let i = 0; i < j.lines.length; i++) { const l = j.lines[i]; if (l.acc !== acc) continue; const amt = fc ? (l.fc || 0) : FP.r2(l.dr - l.cr); if (amt === 0) continue; out.push({ key: j.id + ':' + i, date: j.date, no: j.no, jid: j.id, narration: l.memo || j.narration, amt: amt }); }
      }
      out.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (x.key < y.key ? -1 : 1));
      return out;
    });
  },
  stmt(acc) { return FP.S.bankStmt.filter(s => s.acc === acc).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1)); },
  sets(acc) {
    return FP.memo('bank.sets:' + acc, () => {
      const book = new Map(), st = new Map(); const sm = FP.by(FP.S.bankStmt, 'id'); const bm = FP.by(this.bookLines(acc), 'key');
      for (const m of FP.S.bankMatches) { if (m.acc !== acc) continue; let sd = '', bd = ''; for (const id of m.stmt) { const s = sm.get(id); if (s && s.date > sd) sd = s.date; } for (const k of m.book) { const b = bm.get(k); if (b && b.date > bd) bd = b.date; } const info = { m: m, stmtDate: sd, bookDate: bd }; for (const k of m.book) book.set(k, info); for (const id of m.stmt) st.set(id, info); }
      return { book: book, stmt: st };
    });
  },
  addStmt(d) {
    FP.need('bank'); const a = FP.Coa.get(d.acc); if (!a || !a.bank) throw FP.E('Choose a bank account.');
    if (!FP.D.valid(d.date)) throw FP.E('Enter the statement date of the line.'); const amt = FP.r2(FP.num(d.amount)); if (amt === 0) throw FP.E('Enter an amount: positive for money in, negative for money out.');
    const s = { id: FP.uid('BS'), acc: d.acc, date: d.date, desc: String(d.desc || '').trim() || 'Statement line', ref: String(d.ref || '').trim(), amount: amt };
    FP.S.bankStmt.push(s); if (!d.silent) { FP.audit('Added bank statement line', 'Bank reconciliation', a.code, s.desc + ' ' + FP.fmt.num(amt)); FP.touch(); } return s;
  },
  removeStmt(id) {
    FP.need('bank'); const i = FP.S.bankStmt.findIndex(s => s.id === id); if (i < 0) return; const s = FP.S.bankStmt[i];
    if (FP.S.bankMatches.some(m => m.stmt.indexOf(id) >= 0)) throw FP.E('Unmatch this statement line before deleting it.');
    FP.S.bankStmt.splice(i, 1); FP.archive('bankStmt', s.desc + ' ' + FP.fmt.num(s.amount), s); FP.audit('Deleted bank statement line', 'Bank reconciliation', s.acc, s.desc); FP.touch();
  },
  /* paste rows of: date, description, amount (or money in / money out). Accepts comma, semicolon or tab separators */
  importCsv(acc, text) {
    FP.need('bank'); let n = 0; const errs = [];
    const rows = String(text || '').split(/\r?\n/).map(r => r.trim()).filter(Boolean);
    for (const row of rows) {
      const c = FP.csvSplit(row); if (c.length < 3) continue;
      let date = c[0].trim(); const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(date); if (m) date = m[3] + '-' + FP.pad(+m[2], 2) + '-' + FP.pad(+m[1], 2);
      if (!FP.D.valid(date)) { if (n === 0 && errs.length === 0) { errs.push('header'); continue; } errs.push(row); continue; }
      let amt = FP.num(c[2]); if (c.length >= 4 && c[3].trim() !== '' && !isNaN(parseFloat(c[3].replace(/[, ]/g, '')))) amt = FP.num(c[2]) - FP.num(c[3]);
      if (amt === 0) continue;
      this.addStmt({ acc: acc, date: date, desc: c[1], amount: amt, silent: true }); n++;
    }
    if (n) { FP.audit('Imported bank statement lines', 'Bank reconciliation', acc, n + ' line(s)'); FP.touch(); }
    return { added: n, skipped: errs.filter(e => e !== 'header').length };
  },
  match(acc, bookKeys, stmtIds) {
    FP.need('bank'); if (!bookKeys.length || !stmtIds.length) throw FP.E('Tick at least one cashbook line and one statement line to match.');
    const bm = FP.by(this.bookLines(acc), 'key'), sm = FP.by(FP.S.bankStmt, 'id'); const sets = this.sets(acc); let b = 0, s = 0;
    for (const k of bookKeys) { const x = bm.get(k); if (!x) throw FP.E('A cashbook line is no longer available.'); if (sets.book.has(k)) throw FP.E('A selected cashbook line is already matched.'); b += x.amt; }
    for (const id of stmtIds) { const x = sm.get(id); if (!x) throw FP.E('A statement line is no longer available.'); if (sets.stmt.has(id)) throw FP.E('A selected statement line is already matched.'); s += x.amount; }
    if (!FP.near(b, s)) throw FP.E('The ticked lines do not agree: cashbook ' + FP.fmt.num(b) + ' against statement ' + FP.fmt.num(s) + '. Difference ' + FP.fmt.num(b - s) + '.');
    const m = { id: FP.uid('BM'), acc: acc, book: bookKeys.slice(), stmt: stmtIds.slice(), by: FP.user().id, at: FP.now() };
    FP.S.bankMatches.push(m); FP.audit('Matched bank items', 'Bank reconciliation', acc, bookKeys.length + ' cashbook line(s) to ' + stmtIds.length + ' statement line(s), ' + FP.fmt.num(b)); FP.touch(); return m;
  },
  unmatch(id) { FP.need('bank'); const i = FP.S.bankMatches.findIndex(m => m.id === id); if (i < 0) return; FP.S.bankMatches.splice(i, 1); FP.audit('Unmatched bank items', 'Bank reconciliation', id, ''); FP.touch(); },
  autoMatch(acc, asAt) {
    FP.need('bank'); const a = FP.Coa.get(acc); const start = a.recStart || '0000-00-00'; const sets = this.sets(acc);
    const book = this.bookLines(acc).filter(b => b.date > start && b.date <= asAt && !sets.book.has(b.key)); const used = new Set(); let n = 0;
    for (const s of this.stmt(acc)) {
      if (s.date > asAt || sets.stmt.has(s.id)) continue; let best = null, bd = 99;
      for (const b of book) { if (used.has(b.key) || !FP.near(b.amt, s.amount)) continue; const dd = Math.abs(FP.D.diffDays(b.date, s.date)); if (dd <= 10 && dd < bd) { best = b; bd = dd; } }
      if (best) { used.add(best.key); FP.S.bankMatches.push({ id: FP.uid('BM'), acc: acc, book: [best.key], stmt: [s.id], by: FP.user().id, at: FP.now(), auto: true }); n++; }
    }
    if (n) { FP.audit('Auto-matched bank items', 'Bank reconciliation', acc, n + ' pair(s) matched by amount and date'); FP.touch(); }
    return n;
  },
  recon(acc, asAt) {
    const a = FP.Coa.get(acc); const start = a.recStart || '0000-00-00'; const sets = this.sets(acc);
    const bookBal = a.cur ? FP.Ledger.fcBalAt(acc, asAt) : FP.Ledger.balAt(acc, asAt);
    const stmt = this.stmt(acc); let stmtBal = a.stmtOpen || 0; for (const s of stmt) if (s.date <= asAt) stmtBal += s.amount; stmtBal = FP.r2(stmtBal);
    const outIn = [], outOut = [], matchedBook = [];
    for (const b of this.bookLines(acc)) { if (b.date <= start || b.date > asAt) continue; const m = sets.book.get(b.key); if (m && m.stmtDate <= asAt) { matchedBook.push(b); continue; } if (b.amt > 0) outIn.push(b); else outOut.push(b); }
    const stmtOnly = [], matchedStmt = [];
    for (const s of stmt) { if (s.date > asAt) continue; const m = sets.stmt.get(s.id); if (m && m.bookDate <= asAt) matchedStmt.push(s); else stmtOnly.push(s); }
    const sIn = FP.r2(FP.sum(outIn, x => x.amt)), sOut = FP.r2(FP.sum(outOut, x => x.amt)), sStmt = FP.r2(FP.sum(stmtOnly, x => x.amount));
    const adjusted = FP.r2(stmtBal + sIn + sOut - sStmt);
    return { acc: a, asAt: asAt, bookBal: bookBal, stmtBal: stmtBal, outIn: outIn, outOut: outOut, stmtOnly: stmtOnly, matchedBook: matchedBook, matchedStmt: matchedStmt, sIn: sIn, sOut: sOut, sStmt: sStmt, adjusted: adjusted, diff: FP.r2(bookBal - adjusted), cur: a.cur || FP.S.settings.functional };
  },
  reconModel(acc, asAt) {
    const r = this.recon(acc, asAt); const rows = []; const row = (k, name, amt, extra) => rows.push(Object.assign({ k: k, c: { name: name, amt: amt } }, extra || {}));
    row('row', 'Balance per bank statement', r.stmtBal);
    rows.push({ k: 'head', c: { name: 'Add: receipts in the cashbook not yet credited by the bank' } }); for (const b of r.outIn) rows.push({ k: 'row', indent: 1, c: { date: FP.fmt.date(b.date), name: b.no + ' ' + b.narration, amt: b.amt }, drill: { t: 'jn', id: b.jid } });
    rows.push({ k: 'head', c: { name: 'Less: payments in the cashbook not yet presented to the bank' } }); for (const b of r.outOut) rows.push({ k: 'row', indent: 1, c: { date: FP.fmt.date(b.date), name: b.no + ' ' + b.narration, amt: b.amt }, drill: { t: 'jn', id: b.jid } });
    rows.push({ k: 'head', c: { name: 'Statement items not yet in the cashbook (journal these)' } }); for (const s of r.stmtOnly) rows.push({ k: 'row', indent: 1, c: { date: FP.fmt.date(s.date), name: s.desc, amt: -s.amount } });
    row('sub', 'Adjusted statement balance', r.adjusted); row('row', 'Balance per cashbook (ledger)', r.bookBal); row('total', 'Unreconciled difference', r.diff);
    return { id: 'bankrec', title: 'Bank Reconciliation Statement', company: FP.S.company.name, subtitle: r.acc.code + ' ' + r.acc.name + ', as at ' + FP.fmt.date(asAt), meta: ['Currency: ' + r.cur], columns: [{ key: 'date', label: 'Date', type: 'text' }, { key: 'name', label: 'Particulars', type: 'text' }, { key: 'amt', label: 'Amount', type: 'num' }], rows: rows, check: r.diff };
  }
};

FP.csvSplit = function (row) {
  const sep = row.indexOf('\t') >= 0 ? '\t' : (row.split(';').length > row.split(',').length ? ';' : ',');
  const out = []; let cur = '', q = false;
  for (let i = 0; i < row.length; i++) { const ch = row[i]; if (q) { if (ch === '"') { if (row[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; } else if (ch === '"') q = true; else if (ch === sep) { out.push(cur); cur = ''; } else cur += ch; }
  out.push(cur); return out;
};

/* ---------------- Receivables and payables (party sub-ledgers) ---------------- */
FP.Sub = {
  party(id) { return FP.S.parties.find(p => p.id === id); },
  ctl(type) { return FP.Coa.postings().filter(a => a.partyType === type); },
  /* every posted line on a party-controlled account; sign so that a positive figure is an amount owed */
  lines(type) {
    return FP.memo('sub.lines:' + type, () => {
      const accs = new Set(this.ctl(type).map(a => a.code)); const sign = type === 'C' ? 1 : -1; const out = [];
      for (const j of FP.S.journals) {
        if (j.status !== 'posted' || (j.type === 'OPN' && j.sys) || j.type === 'CLS') continue;
        for (const l of j.lines) if (accs.has(l.acc)) out.push({ date: j.date, jid: j.id, no: j.no, type: j.type, narration: l.memo || j.narration, party: l.party || '', acc: l.acc, amt: FP.r2(sign * (l.dr - l.cr)) });
      }
      out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.jid < b.jid ? -1 : 1));
      return out;
    });
  },
  balances(type, asAt) { const m = new Map(); for (const l of this.lines(type)) { if (asAt && l.date > asAt) continue; FP.addTo(m, l.party, l.amt); } for (const [k, v] of m) m.set(k, FP.r2(v)); return m; },
  statement(partyId, from, to) {
    const p = this.party(partyId); const rows = []; let open = 0, bal = 0;
    for (const l of this.lines(p.type)) { if (l.party !== partyId) continue; if (l.date < from) { open += l.amt; continue; } if (l.date > to) continue; rows.push(l); }
    open = FP.r2(open); bal = open; const out = rows.map(l => { bal = FP.r2(bal + l.amt); return Object.assign({ bal: bal }, l); });
    return { party: p, opening: open, rows: out, closing: bal };
  },
  /* ageing: receipts and credits are applied to the oldest invoices first */
  ageing(type, asAt) {
    const edges = FP.S.settings.ageing; const by = new Map();
    for (const l of this.lines(type)) { if (l.date > asAt) continue; if (!by.has(l.party)) by.set(l.party, { inv: [], paid: 0 }); const g = by.get(l.party); if (l.amt > 0) g.inv.push({ date: l.date, amt: l.amt }); else g.paid += -l.amt; }
    const out = [];
    for (const [pid, g] of by) {
      let paid = g.paid; const b = [0, 0, 0, 0];
      for (const iv of g.inv) { const use = Math.min(paid, iv.amt); paid -= use; const rem = iv.amt - use; if (rem > 0.004) { const age = FP.D.diffDays(iv.date, asAt); const k = age <= edges[0] ? 0 : age <= edges[1] ? 1 : age <= edges[2] ? 2 : 3; b[k] += rem; } }
      if (paid > 0.004) b[0] -= paid;
      const total = FP.r2(b[0] + b[1] + b[2] + b[3]); if (Math.abs(total) < 0.005 && !g.inv.length) continue;
      const p = this.party(pid);
      out.push({ party: pid, name: p ? p.name : '(no party tagged)', b: b.map(FP.r2), total: total });
    }
    out.sort((a, b) => b.total - a.total); return out;
  },
  ageingModel(type, asAt) {
    const e = FP.S.settings.ageing; const data = this.ageing(type, asAt).filter(r => Math.abs(r.total) > 0.004); const rows = []; const t = [0, 0, 0, 0]; let tt = 0;
    for (const r of data) { rows.push({ k: 'row', c: { name: r.name, b0: r.b[0], b1: r.b[1], b2: r.b[2], b3: r.b[3], total: r.total }, drill: r.party ? { t: 'party', id: r.party } : null }); r.b.forEach((v, i) => t[i] += v); tt += r.total; }
    rows.push({ k: 'total', c: { name: 'Total', b0: FP.r2(t[0]), b1: FP.r2(t[1]), b2: FP.r2(t[2]), b3: FP.r2(t[3]), total: FP.r2(tt) } });
    return { id: 'ageing-' + type, title: (type === 'C' ? 'Receivables' : 'Payables') + ' Ageing', company: FP.S.company.name, subtitle: 'As at ' + FP.fmt.date(asAt), meta: ['Currency: ' + FP.S.settings.functional, 'Receipts and credits applied to the oldest items first'], columns: [{ key: 'name', label: type === 'C' ? 'Customer' : 'Supplier', type: 'text' }, { key: 'b0', label: '0 to ' + e[0] + ' days', type: 'num' }, { key: 'b1', label: (e[0] + 1) + ' to ' + e[1] + ' days', type: 'num' }, { key: 'b2', label: (e[1] + 1) + ' to ' + e[2] + ' days', type: 'num' }, { key: 'b3', label: 'Over ' + e[2] + ' days', type: 'num' }, { key: 'total', label: 'Total', type: 'num' }], rows: rows, data: data, totals: t.map(FP.r2) };
  },
  recon(type, asAt) {
    const date = asAt || '9999-12-31'; let sub = 0; for (const v of this.balances(type, asAt).values()) sub += v;
    let gl = 0; const sign = type === 'C' ? 1 : -1; for (const a of this.ctl(type)) gl += sign * FP.Ledger.balAt(a.code, date);
    return { sub: FP.r2(sub), gl: FP.r2(gl), diff: FP.r2(sub - gl) };
  },
  add(d) {
    FP.need('journal.draft');
    if (!String(d.name || '').trim()) throw FP.E('Enter the name.'); if (d.type !== 'C' && d.type !== 'S') throw FP.E('Choose customer or supplier.');
    const p = { id: FP.uid(d.type === 'C' ? 'C' : 'V'), type: d.type, name: String(d.name).trim(), contact: d.contact || '', email: d.email || '', phone: d.phone || '', terms: Math.round(FP.num(d.terms)) || 30, tin: d.tin || '', active: true };
    FP.S.parties.push(p); FP.audit('Added ' + (d.type === 'C' ? 'customer' : 'supplier'), 'Parties', p.id, p.name); FP.touch(); return p;
  },
  update(id, d) {
    FP.need('journal.draft'); const p = this.party(id); if (!p) throw FP.E('Not found.');
    for (const k of ['name', 'contact', 'email', 'phone', 'tin']) if (d[k] != null) p[k] = String(d[k]).trim();
    if (d.terms != null) p.terms = Math.round(FP.num(d.terms)) || 0; if ('active' in d) p.active = !!d.active;
    if (!p.name) throw FP.E('Enter the name.');
    FP.audit('Updated ' + (p.type === 'C' ? 'customer' : 'supplier'), 'Parties', p.id, p.name); FP.touch(); return p;
  },
  remove(id) {
    FP.need('master'); const p = this.party(id); if (!p) return;
    for (const j of FP.S.journals) for (const l of j.lines) if (l.party === id) throw FP.E(p.name + ' has transactions. Mark the record inactive instead of deleting it.');
    FP.S.parties.splice(FP.S.parties.indexOf(p), 1); FP.archive('party', p.name, p); FP.audit('Deleted ' + (p.type === 'C' ? 'customer' : 'supplier'), 'Parties', p.id, p.name); FP.touch();
  }
};

/* ---------------- Master data helpers (Setup Hub) ---------------- */
FP.Master = {
  setCompany(d) {
    FP.need('master'); const c = FP.S.company;
    for (const k of ['name', 'brands', 'industry', 'cac', 'tin', 'address', 'city', 'country', 'phone', 'email', 'website']) if (d[k] != null) c[k] = String(d[k]).trim();
    if (!c.name) throw FP.E('The company name cannot be empty.');
    if (d.extra) c.extra = d.extra.filter(x => String(x.label || '').trim()).map(x => ({ id: x.id || FP.uid('XF'), label: String(x.label).trim(), value: String(x.value || '').trim() }));
    FP.audit('Updated company details', 'Company', c.name, ''); FP.touch();
  },
  addCurrency(d) {
    FP.need('master'); const code = String(d.code || '').trim().toUpperCase();
    if (!/^[A-Z]{3}$/.test(code)) throw FP.E('Currency codes have three letters, for example USD.');
    if (FP.S.currencies.find(c => c.code === code)) throw FP.E(code + ' already exists.');
    const c = { code: code, name: String(d.name || code).trim(), symbol: String(d.symbol || code + ' '), dp: 2 };

  dimUsed(id, code) { for (const j of FP.S.journals) for (const l of j.lines) if (l.dims && l.dims[id] && (code == null || l.dims[id] === code)) return true; return false; },

  /* dimension analysis of income and expense for a period range (functional currency) */
  byDim(fyId, p1, p2, dimId) {
    const m = new Map();

/* ---------------- Restore of archived records ---------------- */
FP.Archive = {
  LABEL: { journal: 'Draft journal', account: 'Account', fiscalYear: 'Fiscal year', rate: 'Exchange rate', asset: 'Asset', assetEvent: 'Asset event', assetClass: 'Asset class', prepaid: 'Prepayment', prepaidEvent: 'Prepayment event', accrual: 'Accrual', item: 'Inventory item', bankStmt: 'Bank statement line', party: 'Customer or supplier', currency: 'Currency', user: 'User', dimension: 'Dimension', dimValue: 'Dimension value' },
  restorable(r) { return ['assetEvent', 'prepaidEvent'].indexOf(r.kind) < 0; },
  restore(id) {
    FP.need('restore'); const S = FP.S; const i = S.archive.findIndex(a => a.id === id); if (i < 0) throw FP.E('Archived item not found.');
    const r = S.archive[i], d = FP.clone(r.data);
    if (r.kind === 'journal') { if (FP.Jn.get(d.id)) throw FP.E('A journal with this identity already exists.'); for (const l of d.lines) if (!FP.Coa.get(l.acc)) throw FP.E('Account ' + l.acc + ' used by this journal no longer exists.'); d.status = 'draft'; S.journals.push(d); }
    else if (r.kind === 'account') { if (FP.Coa.get(d.code)) throw FP.E('Code ' + d.code + ' is in use again. Free the code first.'); if (!d.ctl && !FP.Coa.get(FP.Coa.fsCode(d.code))) throw FP.E('Restore the FS line ' + FP.Coa.fsCode(d.code) + ' first.'); S.coa.push(d); }
    else if (r.kind === 'fiscalYear') { const l = FP.FY.list(); if (S.fiscalYears.find(f => f.id === d.id)) throw FP.E('That fiscal year exists again.'); if (l.length && d.start !== FP.D.addDays(l[l.length - 1].end, 1) && d.end !== FP.D.addDays(l[0].start, -1)) throw FP.E('The archived year no longer fits next to the existing years.'); S.fiscalYears.push(d); }
    else if (r.kind === 'rate') { if (!S.currencies.find(c => c.code === d.cur)) throw FP.E('Restore the currency ' + d.cur + ' first.'); S.rates = S.rates.filter(x => !(x.cur === d.cur && x.freq === d.freq && x.key === d.key)); S.rates.push(d); }
    else if (r.kind === 'asset') { if (!FP.Assets.cls(d.classId)) throw FP.E('The asset class no longer exists.'); S.assets.push(d); }
    else if (r.kind === 'assetClass') S.assetClasses.push(d);
    else if (r.kind === 'prepaid') S.prepaids.push(d);
    else if (r.kind === 'accrual') S.accruals.push(d);
    else if (r.kind === 'item') S.items.push(d);
    else if (r.kind === 'bankStmt') S.bankStmt.push(d);
    else if (r.kind === 'party') S.parties.push(d);
    else if (r.kind === 'currency') { if (S.currencies.find(c => c.code === d.currency.code)) throw FP.E('That currency exists again.'); S.currencies.push(d.currency); for (const x of d.rates) S.rates.push(x); }
    else if (r.kind === 'user') S.users.push(d);
    else if (r.kind === 'dimension') S.dimensions.push(d);
    else if (r.kind === 'dimValue') { const x = S.dimensions.find(q => q.id === (r.extra || {}).dim); if (!x) throw FP.E('The dimension no longer exists.'); x.values.push(d); }
    else throw FP.E('This type of record is kept for reference only. Re-enter it from its module.');
    S.archive.splice(i, 1); FP.audit('Restored from archive', this.LABEL[r.kind] || r.kind, r.label, 'Originally deleted ' + FP.fmt.dt(r.ts)); FP.touch();
  },
  purge(id) { FP.need('admin'); const S = FP.S; const i = S.archive.findIndex(a => a.id === id); if (i < 0) return; const r = S.archive[i]; S.archive.splice(i, 1); FP.audit('Purged archived item', this.LABEL[r.kind] || r.kind, r.label, 'Permanently removed'); FP.touch(); }
};

  async json(id) { return await KV.get('bk:' + FP.S.meta.datasetId + ':' + id); },
  async remove(id) { const ds = FP.S.meta.datasetId; await KV.del('bk:' + ds + ':' + id); const idx = (await this.index()).filter(x => x.id !== id); await KV.set('bkidx:' + ds, JSON.stringify(idx)); App.bkSeq = (App.bkSeq || 0) + 1; },
  async restore(id) {

    const meta = (await this.index()).find(x => x.id === id); if (meta && FP.hash(json) !== meta.hash) throw FP.E('This backup failed its integrity check and was not restored.');

  },
  /* hourly and 11:59 PM snapshots while the application is open; a missed end of day is caught up at the next start */
  async tick() {

    try {
      if (cfg.hourly && (!cfg.lastHourly || now - new Date(cfg.lastHourly) >= 3600000)) { if (cfg.lastRev !== S.meta.rev || !cfg.lastHourly) { await this.create('hourly', 'Automatic hourly backup'); cfg.lastRev = S.meta.rev; } cfg.lastHourly = now.toISOString(); changed = true; }

  /* the same data in several file types; each one can restore the application */
  async files(formats) {

  }

  ['Average rate', 'The exchange rate used to translate income and expenses of a period into another currency.'],
  ['Bank reconciliation', 'A statement that explains the difference between the cashbook balance and the bank statement balance.'],
  ['Carrying amount', 'Cost (or valuation) of an asset less accumulated depreciation and impairment. Also called net book value.'],
  ['Cash and cash equivalents', 'Cash in hand, bank balances and short-term deposits readily convertible to cash.'],
  ['Chart of accounts', 'The coded list of accounts the business posts to. Here each code is Element, FS line and Note line.'],

  ['Closing rate', 'The exchange rate at the reporting date, used to translate assets and liabilities.'],
